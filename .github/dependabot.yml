# Dependabot configuration.
#
# Security alerts + automated security fixes are enabled at the repo level
# (Settings > Code security). This file adds scheduled *version* updates.
#
# Updates are weekly and GROUPED to keep PR volume low — CI here is
# intentionally light (see CLAUDE.md: local testing is the primary gate).
# Security updates are not affected by the grouping or open-PR limits below;
# they always land as soon as an advisory is published.
#
# Each ecosystem is grouped into TWO PRs rather than one, split by update-type:
# minor+patch in one, major in another. A single grouped PR bundling everything
# means one unmergeable major poisons every other update as a unit, and the
# group is then re-offered — and re-fails — every week. That has now happened
# three times:
#   - #604  otel + redis majors broke the Rust API surface
#   - #707  rand 0.9 -> 0.10 removed thread_rng/gen/gen_range (fixed in #721)
#   - #696  typescript 7 has no compatible @typescript-eslint (see below)
# Splitting keeps the routine minor/patch group mergeable and confines a bad
# major to the majors PR. Majors are infrequent, so the extra PR only appears
# in weeks where there is a major to review — which is when you want it
# isolated anyway.
#
# Note: Dependabot has no support for sbt (agenkit-scala) or Zig
# (agenkit-zig); those ecosystems are necessarily excluded.
#
# Two tiers below. The entries in the first block watch the *shipped*
# packages (agenkit-*), weekly. The block at the bottom (#714) uses
# Dependabot's `directories:` (plural, with globs, since 2024) to cover the
# long tail of example/tutorial/test-infra manifests — before #714 only 7 of
# ~44 manifests were watched, so alerts in the other 37 were reported in the
# Security tab with no possible fix PR. That tail runs monthly and grouped so
# it never competes with the shipped-package updates for review.
version: 2
updates:
  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  # Python (core, reference implementation)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]

  # Go
  - package-ecosystem: gomod
    directory: "/agenkit-go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  # TypeScript / Node
  - package-ecosystem: npm
    directory: "/agenkit-ts"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript 7 is held back deliberately: no published @typescript-eslint
    # accepts it. The peer range is `typescript >=4.8.4 <6.1.0` on both the
    # latest (8.65.0) and canary (8.65.1-alpha.19) channels, so `npm ci` hard
    # fails ERESOLVE with TS 7 present. Revisit — and delete this block — once
    # typescript-eslint widens that range. See #722.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  # Rust
  - package-ecosystem: cargo
    directory: "/agenkit-rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  # C# / .NET
  - package-ecosystem: nuget
    directory: "/agenkit-cs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      nuget-major:
        patterns: ["*"]
        update-types: ["major"]

  # Java / Maven
  - package-ecosystem: maven
    directory: "/agenkit-java"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      maven-major:
        patterns: ["*"]
        update-types: ["major"]

  # ────────────────────────────────────────────────────────────────────────
  # Examples, tutorials & test infrastructure (#714)
  #
  # Documentation / test infra, not shipped artifacts — so MONTHLY, grouped,
  # at a low open-PR limit, to never compete with the weekly shipped-package
  # entries above for review. The minor-patch / major split is preserved (see
  # header): frontend-framework majors are routine here, and — unlike an
  # `ignore` rule, which would also suppress *security* updates — isolating
  # them in their own group keeps the security-relevant bumps landing (#714
  # decisions 3 & 4). Globs cover the whole long tail, not just the dirs that
  # happened to have an open alert when #714 was filed.
  #
  # Deliberately NOT covered here:
  #   - pip requirements.txt: most use `>=` floors (already permit the patched
  #     version, so nothing to fix); the `==`-pinned ones aren't worth the
  #     noise — revisit if one gets an advisory (#714 decision 1).
  #   - lockfiles: intentionally absent by repo convention (.gitignore), so
  #     Dependabot bumps the declared ranges, which is exactly the surface an
  #     example teaches (#714 decision 2).

  # npm — example frontends, packages/wasm, TS/wasm test harnesses
  - package-ecosystem: npm
    directories:
      - "/examples/**"
      - "/packages/wasm"
      - "/tests/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      examples-npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      examples-npm-major:
        patterns: ["*"]
        update-types: ["major"]

  # Go — example modules + the Go cross-language test harness
  - package-ecosystem: gomod
    directories:
      - "/examples/**"
      - "/tests/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      examples-go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      examples-go-major:
        patterns: ["*"]
        update-types: ["major"]

  # Rust — the Rust cross-language test harness (tests/cross_language/harness_rust)
  - package-ecosystem: cargo
    directories:
      - "/tests/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      examples-cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      examples-cargo-major:
        patterns: ["*"]
        update-types: ["major"]
