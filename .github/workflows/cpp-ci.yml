name: C++ CI

on:
  push:
    branches: [main]
    paths:
      - 'agenkit-cpp/**'
      - '.github/workflows/cpp-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agenkit-cpp/**'
      - '.github/workflows/cpp-ci.yml'

# DISABLED: Use local testing instead
if: false

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            nlohmann-json3-dev \
            libgtest-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja nlohmann-json googletest

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja
          vcpkg install nlohmann-json gtest

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        run: |
          cd agenkit-cpp
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAGENKIT_BUILD_TESTS=ON \
            -DAGENKIT_BUILD_EXAMPLES=ON \
            -DAGENKIT_BUILD_BENCHMARKS=ON

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cd agenkit-cpp
          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DAGENKIT_BUILD_TESTS=ON `
            -DAGENKIT_BUILD_EXAMPLES=ON `
            -DAGENKIT_BUILD_BENCHMARKS=ON `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: |
          cd agenkit-cpp
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        run: |
          cd agenkit-cpp
          cd build
          ctest --output-on-failure --build-config ${{ matrix.build_type }}

      - name: Build examples (Unix)
        if: runner.os != 'Windows'
        run: |
          cd agenkit-cpp/build
          ./examples/echo_agent
          # Note: http_transport example requires background server, skip in CI

      - name: Build examples (Windows)
        if: runner.os == 'Windows'
        run: |
          cd agenkit-cpp/build
          ./examples/echo_agent.exe
          # Note: http_transport example requires background server, skip in CI

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            cmake \
            ninja-build \
            nlohmann-json3-dev

      - name: Configure CMake
        run: |
          cd agenkit-cpp
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          cd agenkit-cpp
          find src include -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-tidy -p build || true
          # Note: Using || true for now, will enforce in future

  format-check:
    name: Format Check (clang-format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          cd agenkit-cpp
          find src include examples tests -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror || true
          # Note: Using || true for now, will enforce in future
