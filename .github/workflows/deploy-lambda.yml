name: Deploy AWS Lambda

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'examples/deployment/aws-lambda/**'
      - '.github/workflows/deploy-lambda.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'examples/deployment/aws-lambda/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      runtime:
        description: 'Runtime to deploy'
        required: true
        default: 'python'
        type: choice
        options:
          - python
          - go
          - both
      agent_type:
        description: 'Agent type to deploy'
        required: true
        default: 'react'
        type: choice
        options:
          - react
          - conversational
          - router

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'
  GO_VERSION: '1.22'

jobs:
  # ============================================================
  # Python Lambda Deployment with SAM
  # ============================================================
  deploy-python-sam:
    name: Deploy Python Lambda (SAM)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.runtime == 'python' || github.event.inputs.runtime == 'both')) ||
      (github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: examples/deployment/aws-lambda/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build with SAM
        working-directory: examples/deployment/aws-lambda/python
        run: sam build --use-container

      - name: Deploy with SAM
        working-directory: examples/deployment/aws-lambda/python
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          AGENT_TYPE: ${{ github.event.inputs.agent_type || 'react' }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name agenkit-python-${ENVIRONMENT}-${AGENT_TYPE} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              AgentType=${AGENT_TYPE} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM

      - name: Get API endpoint
        id: get-endpoint
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          AGENT_TYPE: ${{ github.event.inputs.agent_type || 'react' }}
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name agenkit-python-${ENVIRONMENT}-${AGENT_TYPE} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Test deployment
        env:
          API_ENDPOINT: ${{ steps.get-endpoint.outputs.endpoint }}
        run: |
          curl -X POST $API_ENDPOINT \
            -H "Content-Type: application/json" \
            -d '{"agent_type": "react", "message": {"role": "user", "content": "Test deployment"}}' \
            --fail-with-body

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Python Lambda deployed successfully!\n\nAPI Endpoint: ${{ steps.get-endpoint.outputs.endpoint }}`
            })

  # ============================================================
  # Go Lambda Deployment with SAM
  # ============================================================
  deploy-go-sam:
    name: Deploy Go Lambda (SAM)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.runtime == 'go' || github.event.inputs.runtime == 'both')) ||
      (github.event_name != 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: examples/deployment/aws-lambda/go/go.sum

      - name: Build Go Lambda
        working-directory: examples/deployment/aws-lambda/go
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build with SAM
        working-directory: examples/deployment/aws-lambda/go
        run: sam build

      - name: Deploy with SAM
        working-directory: examples/deployment/aws-lambda/go
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          AGENT_TYPE: ${{ github.event.inputs.agent_type || 'react' }}
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name agenkit-go-${ENVIRONMENT}-${AGENT_TYPE} \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              AgentType=${AGENT_TYPE} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM

      - name: Get API endpoint
        id: get-endpoint
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
          AGENT_TYPE: ${{ github.event.inputs.agent_type || 'react' }}
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name agenkit-go-${ENVIRONMENT}-${AGENT_TYPE} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT

      - name: Test deployment
        env:
          API_ENDPOINT: ${{ steps.get-endpoint.outputs.endpoint }}
        run: |
          curl -X POST $API_ENDPOINT \
            -H "Content-Type: application/json" \
            -d '{"agent_type": "react", "message": {"role": "user", "content": "Test deployment"}}' \
            --fail-with-body

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Go Lambda deployed successfully!\n\nAPI Endpoint: ${{ steps.get-endpoint.outputs.endpoint }}`
            })

  # ============================================================
  # Terraform Deployment
  # ============================================================
  deploy-terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for Python runtime)
        if: github.event.inputs.runtime == 'python' || github.event.inputs.runtime == 'both'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        if: github.event.inputs.runtime == 'python' || github.event.inputs.runtime == 'both'
        working-directory: examples/deployment/aws-lambda/python
        run: |
          pip install -r requirements.txt -t .

      - name: Set up Go (for Go runtime)
        if: github.event.inputs.runtime == 'go' || github.event.inputs.runtime == 'both'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go Lambda
        if: github.event.inputs.runtime == 'go' || github.event.inputs.runtime == 'both'
        working-directory: examples/deployment/aws-lambda/go
        run: make build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.5

      - name: Terraform Init
        working-directory: examples/deployment/aws-lambda/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: examples/deployment/aws-lambda/terraform
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'prod' }}
          TF_VAR_runtime: ${{ github.event.inputs.runtime || 'python' }}
          TF_VAR_agent_type: ${{ github.event.inputs.agent_type || 'react' }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.environment != ''
        working-directory: examples/deployment/aws-lambda/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: examples/deployment/aws-lambda/terraform
        run: |
          API_URL=$(terraform output -raw api_gateway_invoke_url 2>/dev/null || echo "")
          FUNCTION_URL=$(terraform output -raw function_url 2>/dev/null || echo "")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "function_url=$FUNCTION_URL" >> $GITHUB_OUTPUT

      - name: Test deployment
        if: steps.tf-outputs.outputs.api_url != ''
        env:
          API_URL: ${{ steps.tf-outputs.outputs.api_url }}
        run: |
          curl -X POST $API_URL \
            -H "Content-Type: application/json" \
            -d '{"agent_type": "react", "message": {"role": "user", "content": "Test deployment"}}' \
            --fail-with-body

  # ============================================================
  # Cleanup on PR Close
  # ============================================================
  cleanup:
    name: Cleanup Preview Environments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete Python Lambda stack
        continue-on-error: true
        run: |
          aws cloudformation delete-stack \
            --stack-name agenkit-python-dev-react

      - name: Delete Go Lambda stack
        continue-on-error: true
        run: |
          aws cloudformation delete-stack \
            --stack-name agenkit-go-dev-react
