name: Lint (Basic Formatting)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Basic formatting checks only - detailed linting runs locally
  format-check:
    name: Format Check (Python ruff format + Go fmt)
    # push/schedule -> self-hosted Linux (janus, fast); PRs (incl. forks) ->
    # GitHub-hosted, so untrusted PR code never runs on the LAN runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    # Queue behind this job's own prior push runs — see test.yml's matching
    # block for the full root-cause writeup: the pull_request group key here
    # must never collide with the workflow-level `<workflow>-<pr#>` key above,
    # or the job is silently killed with zero steps and no error (#892 / PR
    # #894 postmortem). github.job is appended on both branches so it can't.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', github.job) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local # pin installed Go; never auto-fetch an old toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          # cache disabled on persistent self-hosted runner (tar restore collides
          # with the on-disk module cache); see govulncheck job in security.yml.
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # ruff was declared three ways with three answers — `>=0.1.0` in pyproject
      # (resolving to 0.14.4), `rev: v0.9.1` in pre-commit, and a bare `ruff` on
      # $PATH in test-local.sh (0.15.10 locally). They disagreed by 28 findings, so
      # `--lint` passed or failed depending on whose machine ran it (#793). Two
      # formatter versions are worse still: each "fixes" the other forever.
      - name: Check tool pins agree
        run: ./scripts/check-tool-pins.sh

      # Use the repo's locked ruff (via uv --extra dev) so CI and local
      # `make format` agree — pinning avoids formatter version skew.
      #
      # `examples/` is included, and must stay in step with the `ruff format` call in
      # the Makefile. This gate checked only agenkit/ tests/ while `make format` wrote
      # agenkit/ tests/ examples/, so it reported "371 files already formatted" while
      # 46 tracked example files were unformatted. Anyone running the documented
      # formatter got a surprise 46-file diff unrelated to their change (#856). Same
      # lesson as the Go half (#849): an excluded directory is a directory that drifts,
      # and examples are documentation (CLAUDE.md).
      - name: Check Python formatting (ruff format)
        run: uv run --extra dev ruff format --check agenkit/ tests/ examples/ || (echo "❌ Python code not formatted. Run 'make format' to fix" && exit 1)

      # Scope is the whole repo, and examples are NOT excluded. This check used to
      # run with `working-directory: agenkit-go` and `grep -v '^examples/'`, which
      # made it blind to 11 unformatted tracked files (#849) — 7 under
      # agenkit-go/examples/ and 4 in Go example trees outside agenkit-go entirely
      # (examples/deployment/aws-lambda/go/, examples/e2e/, examples/infrastructure/,
      # examples/apps/). Examples are documentation (CLAUDE.md), so unformatted
      # examples teach unformatted Go.
      #
      # gofmt is purely syntactic and ignores build constraints, so unlike the
      # compile gate in test.yml this needs no per-file loop for `//go:build ignore`
      # files. .claude/worktrees is excluded because it holds scratch checkouts.
      #
      # Driven off `git ls-files` rather than `gofmt -l .` so the set matches what
      # `make format` fixes exactly. No name-based exclusions: the sole one was
      # `Dockerfile.go`, a Dockerfile despite the extension, which made gofmt exit 2
      # with `illegal character U+0023 '#'`. It is now docker/agenkit-go.Dockerfile,
      # so the glob is honest again and every match really is Go (#856).
      - name: Check Go formatting (gofmt)
        run: |
          FILES=$(git ls-files '*.go' | grep -v '^\.claude/')
          # Fail loudly if the file list is empty rather than reporting success on
          # nothing. `gofmt -s -l` with no arguments reads stdin and exits 0, so a
          # layout change that broke this glob would turn the gate into a silent
          # no-op — the same vacuous-check bug this commit fixes in `make lint`.
          COUNT=$(printf '%s\n' "$FILES" | grep -c . || true)
          if [ "$COUNT" -lt 300 ]; then
            echo "❌ gofmt gate found only $COUNT Go files (expected 300+)."
            echo "   The file list is wrong; fix this gate rather than trusting it."
            exit 1
          fi
          echo "Checking $COUNT Go files"
          UNFORMATTED=$(gofmt -s -l $FILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go code not formatted. Run 'make format' to fix:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # Nothing in CI built these two images, so both had been broken for many releases
  # (#856): the Go one pinned golang:1.21-alpine against a go.mod requiring 1.25.12,
  # and the Python one pinned python:3.11-slim against requires-python >=3.12, so each
  # failed installing the project's own artifact. docker-compose.yml builds both, so
  # `docker compose up` was dead on arrival. Same "built by nothing" rot as #839.
  #
  # Build only — no push, no registry credentials. That is enough to catch base-image
  # drift, which is the whole failure mode here.
  docker-build:
    name: Docker Base Images (build only)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    # Queue behind this job's own prior push runs (#892) — matrix.image is
    # included on BOTH sides so the go/python legs stay independent lanes on
    # push (parallel, as today) and don't cancel each other on pull_request
    # (also as today); only reruns of the SAME image serialize.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', matrix.image) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        image: [go, python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Lightweight monitoring signal (#877): this job builds Docker images
      # on the self-hosted janus runner on every push/schedule run, so it's
      # frequent enough that its log becomes a de facto disk-usage trend
      # even without a human remembering to check. Runs early, before the
      # build step below, so usage is captured even if that step then fails
      # (e.g. from a full disk). The actual scheduled cleanup lives in
      # janus-disk-cleanup.yml; this step only reports, never prunes.
      - name: Report disk usage (monitoring signal)
        run: df -h || true

      # The images label themselves from the root VERSION file via --build-arg rather
      # than a hardcoded literal, which would be a 20th version declaration for the
      # #842 guard to police. Both read "0.1.0" for 86 releases.
      - name: Build ${{ matrix.image }} image
        run: |
          docker build \
            --build-arg VERSION="$(cat VERSION)" \
            -f "docker/agenkit-${{ matrix.image }}.Dockerfile" \
            -t "agenkit-${{ matrix.image }}:ci" .

      # A build that produces an image whose entrypoint does not exist still "passes"
      # docker build. The Go image used to do exactly that: CMD pointed at a binary
      # only its (unreachable) fallback branch produced, so run it and require the
      # declared version back.
      - name: Smoke-run ${{ matrix.image }} image
        run: |
          OUT=$(docker run --rm "agenkit-${{ matrix.image }}:ci" 2>&1 | head -20)
          echo "$OUT"
          EXPECTED=$(cat VERSION)
          LABEL=$(docker inspect "agenkit-${{ matrix.image }}:ci" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          if [ "$LABEL" != "$EXPECTED" ]; then
            echo "❌ image.version label is '$LABEL', expected '$EXPECTED' from VERSION"
            exit 1
          fi
          echo "✓ label matches VERSION ($EXPECTED)"
