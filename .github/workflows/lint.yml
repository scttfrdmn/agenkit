name: Lint (Basic Formatting)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Basic formatting checks only - detailed linting runs locally
  format-check:
    name: Format Check (Python ruff format + Go fmt)
    # push/schedule -> self-hosted Linux (janus, fast); PRs (incl. forks) ->
    # GitHub-hosted, so untrusted PR code never runs on the LAN runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local # pin installed Go; never auto-fetch an old toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          # cache disabled on persistent self-hosted runner (tar restore collides
          # with the on-disk module cache); see govulncheck job in security.yml.
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Use the repo's locked ruff (via uv --extra dev) so CI and local
      # `make format` agree — pinning avoids formatter version skew.
      - name: Check Python formatting (ruff format)
        run: uv run --extra dev ruff format --check agenkit/ tests/ || (echo "❌ Python code not formatted. Run 'make format' to fix" && exit 1)

      # Scope is the whole repo, and examples are NOT excluded. This check used to
      # run with `working-directory: agenkit-go` and `grep -v '^examples/'`, which
      # made it blind to 11 unformatted tracked files (#849) — 7 under
      # agenkit-go/examples/ and 4 in Go example trees outside agenkit-go entirely
      # (examples/deployment/aws-lambda/go/, examples/e2e/, examples/infrastructure/,
      # examples/apps/). Examples are documentation (CLAUDE.md), so unformatted
      # examples teach unformatted Go.
      #
      # gofmt is purely syntactic and ignores build constraints, so unlike the
      # compile gate in test.yml this needs no per-file loop for `//go:build ignore`
      # files. .claude/worktrees is excluded because it holds scratch checkouts.
      #
      # Driven off `git ls-files` rather than `gofmt -l .` so the set matches what
      # `make format` fixes exactly. Dockerfile.go is skipped: it is a Dockerfile
      # despite the extension, and gofmt exits 2 on it with
      # `illegal character U+0023 '#'` (#856).
      - name: Check Go formatting (gofmt)
        run: |
          FILES=$(git ls-files '*.go' | grep -v '^\.claude/' | grep -v '^Dockerfile\.go$')
          UNFORMATTED=$(gofmt -s -l $FILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go code not formatted. Run 'make format' to fix:"
            echo "$UNFORMATTED"
            exit 1
          fi
