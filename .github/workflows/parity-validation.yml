name: Parity Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# NOTE: This workflow is supplementary to local testing.
# Always run `make test` locally before pushing.
# See CLAUDE.md for local testing requirements.

permissions:
  contents: read
  pull-requests: write # for the parity-summary PR comment

jobs:
  parity-check:
    name: Feature Parity Validation
    # Self-hosted (janus) push routing suspended for now (#892, #374) — see
    # test.yml for why. To restore: runs-on: ${{ github.event_name ==
    # 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    runs-on: ubuntu-latest
    # Queue behind this job's own prior push runs (#892). This workflow had no
    # concurrency block before this change, so the pull_request group key is
    # made unique per run (via run_id) rather than per-PR — deliberately
    # preserving "no dedup/cancel behavior on PRs", since adding that now
    # would be an unrelated behavior change.
    #
    # Single outer format() whose ternary ARGUMENT has only plain-value
    # branches (a number or a literal string — never a nested format() call
    # on either side) — that is the one shape confirmed safe across every job
    # in this incident. A bare `cond && format(...) || format(...)`, or even
    # a ternary with one nested format() call as a branch, silently killed 5
    # of 7 self-hosted jobs elsewhere on this same PR with no error surfaced
    # anywhere (#894 postmortem). This job's OLD pull_request branch used
    # run_id specifically so every PR run's key is unique; preserved here by
    # putting run_id in its own format() argument slot instead of building
    # the whole per-branch string inside the ternary.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && 'pr-run' || 'push', github.event_name == 'pull_request' && github.run_id || 'parity-check') }}
      cancel-in-progress: false
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv provisions Python — works on both hosted and self-hosted runners
      # (actions/setup-python only ships CPython for hosted images).
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.13 + dependencies
        run: |
          uv python install 3.13
          uv sync --extra dev --python 3.13

      - name: Scan features across all languages
        run: |
          uv run python scripts/parity/feature_scanner.py

      # Spec-presence conformance (#909 rung 1): does a source file
      # implementing pattern X exist per language, per specs/patterns/*.yaml.
      # A secondary, structural signal distinct from feature_scanner.py's
      # class-count metric above -- see spec_conformance.py's module
      # docstring for why this is a new module rather than a retrofit.
      - name: Check spec-presence conformance
        run: |
          uv run python scripts/parity/spec_conformance.py --check

      # Diffs a fresh regenerate against the committed docs/parity/*.md
      # BEFORE the next step overwrites them, so this fails the build when a
      # scanner/generator change hasn't been accompanied by a regenerated
      # commit -- the gap that let docs/parity/GAPS_ANALYSIS.md go five
      # months stale while this workflow stayed green throughout (#902).
      - name: Verify generated parity docs are current
        run: |
          uv run python scripts/parity/matrix_generator.py --check

      # Same staleness-gate idea, applied to marker-delimited blocks in
      # hand-written docs (README.md's "18 Core Patterns" list, sourced from
      # specs/patterns/*.yaml) rather than whole generated files (#902).
      - name: Verify generated docs facts are current
        run: |
          uv run python scripts/docs_facts.py check

      - name: Generate parity matrix
        run: |
          uv run python scripts/parity/matrix_generator.py

      - name: Generate spec conformance
        run: |
          uv run python scripts/parity/spec_conformance.py

      - name: Run parity tests
        run: |
          uv run pytest tests/parity/ -v --tb=short

      - name: Check for regressions
        run: |
          uv run python scripts/parity/check_regression.py

      # Rendered by check_regression.py so the language list and thresholds come
      # from MIN_FEATURE_COUNTS rather than being duplicated in this workflow.
      - name: Render parity table
        id: parity_table
        if: github.event_name == 'pull_request'
        run: |
          {
            echo 'table<<PARITY_EOF'
            uv run python scripts/parity/check_regression.py --markdown
            echo 'PARITY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-reports
          path: |
            feature-manifest.json
            spec-conformance.json
            docs/parity/FEATURE_MATRIX.md
            docs/parity/GAPS_ANALYSIS.md
          retention-days: 30

      - name: Comment PR with parity summary
        # Forked PRs get a read-only token, so commenting will fail there — keep
        # it non-fatal so a missing comment never reds the whole run.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const manifest = JSON.parse(fs.readFileSync('feature-manifest.json', 'utf8'));

            const comment = [
              '## 🔍 Feature Parity Report',
              '',
              `${{ steps.parity_table.outputs.table }}`,
              '',
              `**Generated**: ${manifest.generated_at}`,
              '',
              '📊 View full reports in workflow artifacts',
              `📋 See [FEATURE_MATRIX.md](../blob/${process.env.GITHUB_SHA}/docs/parity/FEATURE_MATRIX.md) for details`,
            ].join('\n');

            // Dependabot / forked PRs run with a read-only token, so the
            // create-comment call rejects. Await inside try/catch so the
            // rejection is handled here and never escapes as an unhandled
            // promise rejection (which crashes Node and defeats
            // continue-on-error).
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              core.warning(`Could not post parity comment (read-only token?): ${error.message}`);
            }

  # Informational only: this job never inspects parity-check's outcome and its
  # step always succeeds, so it must not be named or worded like a gate — a
  # step that reports success unconditionally cannot claim to have validated
  # anything. Keeping the `parity-gate` job key stable since nothing else in
  # the repo references it; only the display name and step text were
  # misleading and are fixed here.
  parity-gate:
    name: Parity Summary (informational, non-blocking)
    runs-on: ubuntu-latest
    needs: parity-check
    if: github.event_name == 'pull_request'

    steps:
      - name: Parity summary marker
        run: |
          echo "ℹ️ Parity summary complete — see the parity-check job above for actual results"
          echo "This step does not block merges; it exists as a readable summary marker only."
