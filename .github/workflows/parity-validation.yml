name: Parity Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# NOTE: This workflow is supplementary to local testing.
# Always run `make test` locally before pushing.
# See CLAUDE.md for local testing requirements.

permissions:
  contents: read
  pull-requests: write # for the parity-summary PR comment

jobs:
  parity-check:
    name: Feature Parity Validation
    # push/schedule -> self-hosted Linux (janus, fast); PRs (incl. forks) ->
    # GitHub-hosted, so untrusted PR code never runs on the LAN runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uv provisions Python — works on both hosted and self-hosted runners
      # (actions/setup-python only ships CPython for hosted images).
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python 3.12 + dependencies
        run: |
          uv python install 3.12
          uv sync --extra dev --python 3.12

      - name: Scan features across all languages
        run: |
          uv run python scripts/parity/feature_scanner.py

      - name: Generate parity matrix
        run: |
          uv run python scripts/parity/matrix_generator.py

      - name: Run parity tests
        run: |
          uv run pytest tests/parity/ -v --tb=short

      - name: Check for regressions
        run: |
          uv run python scripts/parity/check_regression.py

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-reports
          path: |
            feature-manifest.json
            docs/parity/FEATURE_MATRIX.md
            docs/parity/GAPS_ANALYSIS.md
          retention-days: 30

      - name: Comment PR with parity summary
        # Forked PRs get a read-only token, so commenting will fail there — keep
        # it non-fatal so a missing comment never reds the whole run.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read feature manifest
            const manifest = JSON.parse(fs.readFileSync('feature-manifest.json', 'utf8'));
            const summary = manifest.summary.total;

            // Calculate parity percentages
            const pythonTotal = summary.python;
            const parityPct = (lang) => ((summary[lang] / pythonTotal) * 100).toFixed(1);

            // Build comment
            const comment = `## 🔍 Feature Parity Report

            | Language | Features | Parity % | Status |
            |----------|----------|----------|--------|
            | Python | ${summary.python} | 100.0% | ✅ Baseline |
            | Go | ${summary.go} | ${parityPct('go')}% | ${summary.go >= 43 ? '✅' : '⚠️'} |
            | TypeScript | ${summary.typescript} | ${parityPct('typescript')}% | ${summary.typescript >= 35 ? '✅' : '⚠️'} |
            | Rust | ${summary.rust} | ${parityPct('rust')}% | ${summary.rust >= 35 ? '✅' : '⚠️'} |
            | C++ | ${summary.cpp} | ${parityPct('cpp')}% | ${summary.cpp >= 35 ? '✅' : '⚠️'} |
            | Zig | ${summary.zig} | ${parityPct('zig')}% | ${summary.zig >= 25 ? '✅' : '⚠️'} |

            **Generated**: ${manifest.generated_at}

            📊 View full reports in workflow artifacts
            📋 See [FEATURE_MATRIX.md](../blob/${process.env.GITHUB_SHA}/docs/parity/FEATURE_MATRIX.md) for details
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Optional: Block PR if parity regresses
  parity-gate:
    name: Parity Gate (Optional)
    runs-on: ubuntu-latest
    needs: parity-check
    if: github.event_name == 'pull_request'

    steps:
      - name: Check parity gate
        run: |
          echo "✅ Parity validation passed"
          echo "This is an informational gate - local testing is primary validation"
