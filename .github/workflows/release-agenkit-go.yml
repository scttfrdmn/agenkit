name: Release agenkit-go

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.10.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional - will use template if empty)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format vX.Y.Z (e.g., v0.10.0)"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          if git ls-remote --tags https://github.com/scttfrdmn/agenkit-go | grep -q "refs/tags/${{ inputs.version }}"; then
            echo "Error: Tag ${{ inputs.version }} already exists in standalone repo"
            exit 1
          fi

      - name: Sync to standalone repository
        uses: ./.github/workflows/sync-agenkit-go.yml

      - name: Clone standalone repo and create release
        env:
          AGENKIT_GO_TOKEN: ${{ secrets.AGENKIT_GO_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENKIT_GO_TOKEN }}
        run: |
          # Clone standalone repo
          git clone https://x-access-token:${AGENKIT_GO_TOKEN}@github.com/scttfrdmn/agenkit-go.git /tmp/agenkit-go-release
          cd /tmp/agenkit-go-release
          git checkout main

          # Create release notes
          if [ -z "${{ inputs.release_notes }}" ]; then
            RELEASE_NOTES="agenkit-go ${{ inputs.version }}

          This release contains the Go SDK from the agenkit monorepo.

          **Installation:**
          \`\`\`bash
          go get github.com/scttfrdmn/agenkit-go@${{ inputs.version }}
          \`\`\`

          **Changes:** All lint fixes and improvements from monorepo.

          **Full Changelog:** https://github.com/scttfrdmn/agenkit/releases/tag/${{ inputs.version }}"
          else
            RELEASE_NOTES="${{ inputs.release_notes }}"
          fi

          # Create and push tag
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ inputs.version }}" -m "$RELEASE_NOTES"
          git push origin "${{ inputs.version }}"

          # Create GitHub release
          gh release create "${{ inputs.version }}" \
            --repo scttfrdmn/agenkit-go \
            --title "agenkit-go ${{ inputs.version }}" \
            --notes "$RELEASE_NOTES"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/agenkit-go-release

      - name: Release complete
        run: |
          echo "✓ Release complete!"
          echo ""
          echo "Standalone repository: https://github.com/scttfrdmn/agenkit-go/releases/tag/${{ inputs.version }}"
          echo ""
          echo "Users can install with:"
          echo "  go get github.com/scttfrdmn/agenkit-go@${{ inputs.version }}"
