name: Security

# Security scanning (SAST + dependency + vuln + IaC). This is the sanctioned
# exception to the "local testing only" policy in CLAUDE.md: functional CI is
# kept minimal, but security tooling runs here because it only delivers value
# in CI (PR gating, scheduled scans, GitHub Security tab / SARIF integration).
#
# Runner split (public repo + self-hosted Linux runners on janus.local):
#   - push to main / tags / schedule  -> self-hosted [self-hosted, Linux]
#                                         (janus, Rocky 9 + Docker — container
#                                         jobs run natively)
#   - pull_request (incl. forks)       -> ephemeral GitHub-hosted runner, so
#                                         untrusted PR code never executes on the
#                                         LAN runner.
# Note: orion (macOS) cannot run `container:` jobs, so CI targets the Linux
# runners; orion stays available as overflow for non-container work.
# See: https://docs.github.com/actions/security-guides/security-hardening-for-github-actions#hardening-for-self-hosted-runners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1" # Mondays 06:27 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab

jobs:
  # ---------------------------------------------------------------------------
  # CodeQL SAST. Covers the languages CodeQL supports here; Rust, Zig, and
  # Scala are NOT supported by CodeQL and are covered by semgrep below instead.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Self-hosted (janus) push routing suspended for now (#892, #374) — see
    # test.yml for why. To restore: runs-on: ${{ github.event_name ==
    # 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    runs-on: ubuntu-latest
    # Queue behind this job's own prior push runs (#892) — matrix.language is
    # included on BOTH sides so the 4 language legs stay independent lanes on
    # push (parallel, as today) and don't cancel each other on pull_request
    # (also as today); only reruns of the SAME language serialize.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', matrix.language) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    env:
      # The self-hosted runner has an older system `go` (1.22) earlier on PATH
      # than setup-go's 1.25.12 below — setup-go@v6+ no longer guarantees its
      # Go wins PATH (v5 did) — and the runner's go env pins GOTOOLCHAIN=local.
      # Go autobuild for the new examples/*, tests/cross_language/harness_go
      # modules (added in #860) then fails extraction on every push run with
      # "go.mod requires go >= 1.25.12 (running go 1.22.0)" (#876), because the
      # build happens inside codeql-action's init/analyze steps where there's
      # no `run:` step to force PATH order the way the govulncheck job below
      # does. GOTOOLCHAIN=auto lets whichever `go` actually executes — even
      # the shadowing system 1.22.0 — fetch the toolchain go.mod declares.
      # Mirrors the govulncheck job's fix in this file and the Go smoke-test
      # steps in test.yml.
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        # build-mode none (buildless extraction) for interpreted languages;
        # compiled languages (Go, Java) require autobuild — Go explicitly
        # rejects build-mode none.
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: java
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7
      # Go autobuild compiles agenkit-go, whose go.mod requires Go 1.25.12.
      # Provision that toolchain (and put it first on PATH) so autobuild on the
      # self-hosted runner doesn't fall back to an older system Go.
      - name: Set up Go (for go autobuild)
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # Trivy: filesystem scan (dependencies + misconfig + secrets) across the
  # whole repo. Results uploaded as SARIF.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy filesystem scan
    # Self-hosted (janus) push routing suspended for now (#892, #374) — see
    # test.yml for why. To restore: runs-on: ${{ github.event_name ==
    # 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    runs-on: ubuntu-latest
    # Queue behind this job's own prior push runs (#892) — this is one of the
    # three jobs that actually failed in the incident: Trivy's vulnerability-DB
    # download hit "no space left on device" when a merge burst ran multiple
    # copies at once. Literal job-name suffix, not `github.job` — see the
    # govulncheck job below for why (that context evaluated to empty for two
    # of this file's jobs on PR #894, for reasons not fully isolated).
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', 'trivy') }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # Go vulnerability scanning (govulncheck) — call-graph aware, so it reports
  # only vulns the code actually reaches.
  # ---------------------------------------------------------------------------
  govulncheck:
    name: govulncheck (Go)
    # Self-hosted (janus) push routing suspended for now (#892, #374) — see
    # test.yml for why. To restore: runs-on: ${{ github.event_name ==
    # 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    runs-on: ubuntu-latest
    # Queue behind this job's own prior push runs (#892). See test.yml for
    # the group-key collision root cause. The job-name suffix is a LITERAL
    # ('govulncheck'), not `github.job` — that context evaluated to an empty
    # string for this specific job on PR #894 (group came back as
    # "Security-894-" with a trailing hyphen and nothing after), while the
    # identical construction worked in test.yml and lint.yml. Root cause not
    # fully isolated; a literal sidesteps whatever the inconsistency is rather
    # than relying on a context that silently produced empty strings once.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', 'govulncheck') }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version: "1.25.12"
          # cache disabled: on the persistent self-hosted runner the module
          # cache already lives on disk, and setup-go's tar-based restore
          # collided with it ("Cannot open: File exists"), corrupting state.
          cache: false
      # The self-hosted runner has older `go` binaries earlier on PATH that
      # shadow setup-go's. Invoke setup-go's Go explicitly via $GOROOT so the
      # version is deterministic regardless of PATH ordering.
      - name: Install + run govulncheck
        working-directory: agenkit-go
        # GOTOOLCHAIN=auto (overriding the local default) lets `go install`
        # fetch the toolchain govulncheck@latest needs (go >= 1.25). Under
        # setup-go@v6, $GOROOT can resolve to the image's preinstalled go1.24,
        # and with GOTOOLCHAIN=local that older go cannot build govulncheck.
        # govulncheck keys its stdlib analysis on go.mod's `go` directive, not
        # the building toolchain, so results are unchanged.
        env:
          GOTOOLCHAIN: auto
        run: |
          # Force setup-go's Go ahead of any older system go on the runner PATH,
          # for this step and for govulncheck's own toolchain shell-outs.
          export PATH="$GOROOT/bin:$PATH"
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ---------------------------------------------------------------------------
  # Semgrep SAST — covers all languages, including the ones CodeQL can't
  # (Rust, Zig, Scala). Uploads SARIF to the Security tab.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    # Self-hosted (janus) push routing suspended for now (#892, #374) — see
    # test.yml for why. To restore: runs-on: ${{ github.event_name ==
    # 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    runs-on: ubuntu-latest
    # Queue behind this job's own prior push runs (#892). Literal job-name
    # suffix, not `github.job` — see the govulncheck job above for why.
    concurrency:
      group: ${{ format('{0}-{1}-{2}', github.workflow, github.event_name == 'pull_request' && github.event.pull_request.number || 'push', 'semgrep') }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Run semgrep via `docker run --user` rather than a `container:` job, so
      # output files are owned by the runner user. A `container:` job runs as
      # root and litters the shared self-hosted `_work` dir with root-owned
      # files that break later (non-container) jobs' checkout step.
      - name: Semgrep scan (SARIF)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/src \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep
