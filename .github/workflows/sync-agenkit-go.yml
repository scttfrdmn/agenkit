name: Sync agenkit-go to Standalone Repository

on:
  push:
    branches: [ main ]
    paths:
      - 'agenkit-go/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for subtree split

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Split subtree
        id: split
        run: |
          SPLIT_COMMIT=$(git subtree split --prefix=agenkit-go HEAD)
          echo "split_commit=$SPLIT_COMMIT" >> $GITHUB_OUTPUT

      - name: Checkout split to temp directory
        run: |
          mkdir -p /tmp/agenkit-go-sync
          cd /tmp/agenkit-go-sync
          git init
          git remote add origin ${{ github.repositoryUrl }}
          git fetch origin ${{ steps.split.outputs.split_commit }}
          git checkout ${{ steps.split.outputs.split_commit }}

      - name: Transform import paths
        run: |
          cd /tmp/agenkit-go-sync
          # Replace all import paths
          find . -type f -name "*.go" -exec sed -i \
            's|github.com/scttfrdmn/agenkit/agenkit-go|github.com/scttfrdmn/agenkit-go|g' {} +
          # Update go.mod
          sed -i 's|module github.com/scttfrdmn/agenkit/agenkit-go|module github.com/scttfrdmn/agenkit-go|g' go.mod
          # Commit transformation
          git add -A
          git diff --cached --quiet || git commit -m "chore: Transform import paths for standalone repository [skip ci]"

      - name: Push to standalone repository
        env:
          AGENKIT_GO_TOKEN: ${{ secrets.AGENKIT_GO_TOKEN }}
        run: |
          cd /tmp/agenkit-go-sync
          git remote add standalone https://x-access-token:${AGENKIT_GO_TOKEN}@github.com/scttfrdmn/agenkit-go.git
          git push --force standalone HEAD:main

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/agenkit-go-sync
