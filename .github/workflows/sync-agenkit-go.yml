name: Sync agenkit-go to Standalone Repository

# Keeps the distribution mirror github.com/scttfrdmn/agenkit-go in sync with the
# agenkit-go/ subtree of this monorepo, transforming the module path so the mirror
# can be consumed with the idiomatic root import:
#   go get github.com/scttfrdmn/agenkit-go@latest   (tracks mirror main)
#   go get github.com/scttfrdmn/agenkit-go@vX.Y.Z   (tracks a release tag)
#
# Triggers:
#   - push to main touching agenkit-go/**  -> sync mirror main
#   - push of a vX.Y.Z tag                 -> sync mirror main + create matching tag & release
#   - manual (workflow_dispatch)           -> sync mirror main

on:
  push:
    branches: [main]
    paths:
      - 'agenkit-go/**'
      - '.github/workflows/sync-agenkit-go.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: sync-agenkit-go
  cancel-in-progress: false

env:
  OLD_PATH: github.com/scttfrdmn/agenkit/agenkit-go
  NEW_PATH: github.com/scttfrdmn/agenkit-go
  MIRROR: scttfrdmn/agenkit-go

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Sync agenkit-go/ into the mirror (transform import paths)
        env:
          AGENKIT_GO_TOKEN: ${{ secrets.AGENKIT_GO_TOKEN }}
        run: |
          set -euo pipefail

          MONO_COMMIT="$(git rev-parse --short HEAD)"
          WORK="$(mktemp -d)"

          echo "Cloning mirror (preserving history)..."
          git clone "https://x-access-token:${AGENKIT_GO_TOKEN}@github.com/${MIRROR}.git" "$WORK"

          echo "Replacing mirror contents with monorepo agenkit-go/ (tracked files only)..."
          find "$WORK" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          git archive HEAD:agenkit-go | tar -x -C "$WORK"

          echo "Transforming import paths in .go / .mod / .md ..."
          grep -rl "$OLD_PATH" "$WORK" --include='*.go' --include='*.mod' --include='*.md' \
            | xargs -r sed -i "s|${OLD_PATH}|${NEW_PATH}|g"

          echo "Verifying transform..."
          head -1 "$WORK/go.mod"
          if grep -rq "$OLD_PATH" "$WORK" --include='*.go' --include='*.mod' --include='*.md'; then
            echo "::error::Stale references to $OLD_PATH remain after transform"
            grep -rl "$OLD_PATH" "$WORK" --include='*.go' --include='*.mod' --include='*.md'
            exit 1
          fi

          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already up to date — nothing to push."
          else
            git commit -m "sync: from scttfrdmn/agenkit @ ${MONO_COMMIT} [skip ci]" \
                       -m "Import paths transformed: ${OLD_PATH} -> ${NEW_PATH}"
            git push origin HEAD:main
            echo "Pushed mirror main."
          fi

      - name: Tag and release mirror (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.AGENKIT_GO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          if gh release view "$VERSION" --repo "$MIRROR" >/dev/null 2>&1; then
            echo "Release $VERSION already exists on mirror — skipping."
            exit 0
          fi

          NOTES="agenkit-go ${VERSION}

          This release contains the Go SDK from the agenkit monorepo, synced to ${VERSION}.

          **Installation:**
          \`\`\`bash
          go get github.com/scttfrdmn/agenkit-go@${VERSION}
          \`\`\`

          **Full Changelog:** https://github.com/scttfrdmn/agenkit/releases/tag/${VERSION}"

          # Create the release; --target main tags the just-synced mirror HEAD.
          gh release create "$VERSION" \
            --repo "$MIRROR" \
            --target main \
            --title "agenkit-go ${VERSION}" \
            --notes "$NOTES"
          echo "Created mirror release $VERSION."
