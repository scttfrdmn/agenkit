name: CI Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Minimal smoke test - local testing is primary validation
  smoke-test:
    name: Smoke Test (Python 3.12 + Go 1.25)
    # push/schedule -> self-hosted Linux (janus, fast); PRs (incl. forks) ->
    # GitHub-hosted, so untrusted PR code never runs on the LAN runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local # pin installed Go; never auto-fetch an old toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'
          # cache disabled on persistent self-hosted runner (tar restore collides
          # with the on-disk module cache); see govulncheck job in security.yml.
          cache: false

      # uv provisions Python itself — works identically on GitHub-hosted and
      # self-hosted runners. (actions/setup-python only ships prebuilt CPython
      # for hosted images, so it fails on the self-hosted Linux runners.)
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.12 + dependencies
        run: |
          uv python install 3.12
          uv sync --extra test --python 3.12

      - name: Run Python smoke tests (quick, no integration)
        run: |
          # Very minimal smoke test - CI environment is weak
          # Excludes: integration, cross_language, chaos, observability, property tests
          # Full validation via 'make test' locally
          uv run pytest tests/ -n auto -q \
            -m "not integration and not cross_language and not chaos" \
            --ignore=tests/observability/ \
            --ignore=tests/property/ \
            --maxfail=5
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run Go smoke tests
        working-directory: agenkit-go
        # The self-hosted runner has an older system `go` (1.22) earlier on PATH
        # than setup-go's 1.25.11. setup-go@v6 no longer guarantees its Go wins
        # PATH (v5 did), so the shadowing system go ran and — with the job-level
        # GOTOOLCHAIN=local — could not satisfy go.mod's `go >= 1.25.11`.
        # GOTOOLCHAIN=auto here lets whichever go runs fetch the required
        # toolchain; the tests still execute against 1.25.11. Mirrors the
        # govulncheck step's fix in security.yml.
        env:
          GOTOOLCHAIN: auto
        run: |
          go version
          # Quick tests without race detector for speed
          go test -short $(go list ./... | grep -v /examples/) -failfast

      - name: Build Go cross-language harness (blocking)
        working-directory: tests/cross_language/harness_go
        # These harnesses build against the agenkit-go core via a local `replace`.
        # They are NOT exercised by the smoke tests above, so an API change in the
        # core (e.g. Message.Content string -> any) can silently break them — which
        # is exactly what happened while a prebuilt binary masked it (see #662).
        # A compile gate here catches that class of rot. go vet also runs the build.
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          go build -o /dev/null .

  # CI coverage for the remaining language implementations. Runs on
  # GitHub-hosted runners for BOTH push and pull_request: the hosted images
  # reliably provision every toolchain (the self-hosted janus runners may not
  # have Rust/Zig/.NET/JVM installed), and these suites touch no secrets, so
  # there's no fork-safety reason to keep them off hosted runners. Python+Go
  # stay on the self-hosted runner above for speed.
  #
  # Each language has TWO steps:
  #   - a BLOCKING compile/build gate — catches real regressions (e.g. a dep
  #     bump that breaks the API surface). This is the gate that would have
  #     caught the otel/redis breakage that shipped via the cargo group bump.
  #   - a NON-BLOCKING test run (continue-on-error) — surfaces test results
  #     without false-failing PRs while the suites are still being hardened
  #     (several have timing-sensitive / non-hermetic tests; tracked as
  #     follow-up issues). Flip these to blocking per-language as each suite
  #     is stabilized.
  lang-smoke:
    name: Smoke (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, rust, csharp, java, scala, zig]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- TypeScript ---
      - name: Set up Node
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: TypeScript install
        if: matrix.lang == 'typescript'
        working-directory: agenkit-ts
        run: npm ci
      - name: TypeScript build (blocking)
        if: matrix.lang == 'typescript'
        working-directory: agenkit-ts
        run: npm run build
      # Hard 5-min cap: some TS tests connect to Redis and retry until the job
      # timeout when it's absent. Non-blocking + bounded so it can't stall the
      # matrix (suite hardening tracked as a follow-up).
      - name: TypeScript tests (non-blocking)
        if: matrix.lang == 'typescript'
        continue-on-error: true
        working-directory: agenkit-ts
        run: timeout 300 npm test || true

      # --- Rust ---
      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust build (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo build --quiet
      - name: Rust tests (non-blocking)
        if: matrix.lang == 'rust'
        continue-on-error: true
        working-directory: agenkit-rust
        run: cargo test --lib --quiet

      # --- C# / .NET ---
      - name: Set up .NET
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: C# build (blocking)
        if: matrix.lang == 'csharp'
        run: dotnet build agenkit-cs/Agenkit.sln --nologo -v q
      - name: C# tests (non-blocking)
        if: matrix.lang == 'csharp'
        continue-on-error: true
        run: dotnet test agenkit-cs/Agenkit.sln --nologo -q --no-build

      # --- Java ---
      - name: Set up JDK
        if: matrix.lang == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Java compile (blocking)
        if: matrix.lang == 'java'
        working-directory: agenkit-java
        run: mvn -B -q test-compile
      - name: Java tests (non-blocking)
        if: matrix.lang == 'java'
        continue-on-error: true
        working-directory: agenkit-java
        run: mvn -B -q test

      # --- Scala ---
      - name: Set up JDK (Scala)
        if: matrix.lang == 'scala'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up sbt
        if: matrix.lang == 'scala'
        uses: sbt/setup-sbt@v1
      - name: Scala compile (blocking)
        if: matrix.lang == 'scala'
        working-directory: agenkit-scala
        run: sbt -batch "Test/compile"
      - name: Scala tests (non-blocking)
        if: matrix.lang == 'scala'
        continue-on-error: true
        working-directory: agenkit-scala
        run: sbt -batch test

      # --- Zig ---
      - name: Set up Zig
        if: matrix.lang == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          # Matches build.zig.zon .minimum_zig_version
          version: 0.16.0
      # `zig build test` builds + runs the library/test modules. Migrated to
      # Zig 0.16.0 (#646), so this is the real compile+test gate.
      - name: Zig build + test (blocking)
        if: matrix.lang == 'zig'
        working-directory: agenkit-zig
        run: zig build test

  # Redis-backed tests (Python + TypeScript RedisMemory). These suites skip
  # themselves when no Redis server is reachable, so they never gated anything
  # in CI. A redis:7-alpine service container makes them actually run. Hosted
  # ubuntu only (both push and PR): keeps untrusted PR code off the LAN runners
  # and the hosted image has Docker for the service container. Separate job so
  # the smoke/lang jobs stay fast and unaffected. (#648)
  redis-tests:
    name: Redis Tests (Python + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- Python RedisMemory tests ---
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.12 + redis extra
        run: |
          uv python install 3.12
          uv sync --extra test --extra redis --python 3.12
      - name: Run Python RedisMemory tests
        run: uv run pytest tests/memory/test_redis_memory.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      # --- TypeScript RedisMemory tests ---
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: TypeScript RedisMemory tests
        working-directory: agenkit-ts
        run: |
          npm ci
          npx vitest run src/__tests__/memory/redis.test.ts

