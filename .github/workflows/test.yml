name: CI Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Minimal smoke test - local testing is primary validation
  smoke-test:
    name: Smoke Test (Python 3.13 + Go 1.25)
    # push/schedule -> self-hosted Linux (janus, fast); PRs (incl. forks) ->
    # GitHub-hosted, so untrusted PR code never runs on the LAN runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local # pin installed Go; never auto-fetch an old toolchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go 1.25
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          # cache disabled on persistent self-hosted runner (tar restore collides
          # with the on-disk module cache); see govulncheck job in security.yml.
          cache: false

      # uv provisions Python itself — works identically on GitHub-hosted and
      # self-hosted runners. (actions/setup-python only ships prebuilt CPython
      # for hosted images, so it fails on the self-hosted Linux runners.)
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python 3.13 + dependencies
        run: |
          uv python install 3.13
          uv sync --extra test --python 3.13

      - name: Run Python smoke tests (quick, no integration)
        run: |
          # Very minimal smoke test - CI environment is weak
          # Excludes: integration, cross_language, chaos, observability, property tests
          # Full validation via 'make test' locally
          uv run pytest tests/ -n auto -q \
            -m "not integration and not cross_language and not chaos" \
            --ignore=tests/observability/ \
            --ignore=tests/property/ \
            --maxfail=5
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run Go smoke tests
        working-directory: agenkit-go
        # The self-hosted runner has an older system `go` (1.22) earlier on PATH
        # than setup-go's 1.25.12. setup-go@v6 no longer guarantees its Go wins
        # PATH (v5 did), so the shadowing system go ran and — with the job-level
        # GOTOOLCHAIN=local — could not satisfy go.mod's `go >= 1.25.12`.
        # GOTOOLCHAIN=auto here lets whichever go runs fetch the required
        # toolchain; the tests still execute against 1.25.12. Mirrors the
        # govulncheck step's fix in security.yml.
        env:
          GOTOOLCHAIN: auto
        run: |
          go version
          # Quick tests without race detector for speed
          go test -short $(go list ./... | grep -v /examples/) -failfast

      - name: Compile Go README snippets (blocking)
        working-directory: agenkit-go
        # examples/readme/ is the compiled source of truth for every snippet in
        # agenkit-go/README.md — the mirror's landing page. The Go smoke test above
        # excludes ./examples/..., so without this gate the snippets are built by
        # nothing. Before #839 that let the README accumulate nine wrong or
        # fictional constructors (NewRetryMiddleware, ConversationalConfig,
        # transport/http, ...), all of them plausible enough to survive review.
        #
        # `go run` as well as `go build`: a nil aggregator passed to
        # NewParallelAgent compiles fine and only fails when executed, so
        # compiling alone would not have caught it.
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./examples/readme/
          go run ./examples/readme/

      - name: Compile build-tagged Go examples (blocking)
        working-directory: agenkit-go
        # Every standalone example under examples/ carries `//go:build ignore` so
        # that a tree of `package main` files can coexist in one directory. That tag
        # also excludes them from `go build ./...`, `go vet ./...`, and the smoke
        # test above — so before #843 they were compiled by nothing, and 8 of 41
        # had stopped building. Naming a file directly still compiles it: the tag
        # only removes it from package-level builds.
        #
        # The 8 failures were not example typos. They were the visible end of a
        # library-wide interface rot (#847): Introspect() was added to
        # agenkit.Agent without conformance assertions, so 22 agent-shaped types
        # silently stopped satisfying it, and no pattern agent could be wrapped in
        # middleware. The only consumer that tried was a build-tagged example.
        env:
          GOTOOLCHAIN: auto
        run: |
          fail=0
          for f in $(grep -rln '^//go:build ignore' --include='*.go' examples/); do
            go build -o /dev/null "$f" || { echo "FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Build Go cross-language harness (blocking)
        working-directory: tests/cross_language/harness_go
        # These harnesses build against the agenkit-go core via a local `replace`.
        # They are NOT exercised by the smoke tests above, so an API change in the
        # core (e.g. Message.Content string -> any) can silently break them — which
        # is exactly what happened while a prebuilt binary masked it (see #662).
        # A compile gate here catches that class of rot. go vet also runs the build.
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          go build -o /dev/null .

  # CI coverage for the remaining language implementations. Runs on
  # GitHub-hosted runners for BOTH push and pull_request: the hosted images
  # reliably provision every toolchain (the self-hosted janus runners may not
  # have Rust/Zig/.NET/JVM installed), and these suites touch no secrets, so
  # there's no fork-safety reason to keep them off hosted runners. Python+Go
  # stay on the self-hosted runner above for speed.
  #
  # Each language has TWO steps:
  #   - a BLOCKING compile/build gate — catches real regressions (e.g. a dep
  #     bump that breaks the API surface). This is the gate that would have
  #     caught the otel/redis breakage that shipped via the cargo group bump.
  #   - a NON-BLOCKING test run (continue-on-error) — surfaces test results
  #     without false-failing PRs while the suites are still being hardened
  #     (several have timing-sensitive / non-hermetic tests; tracked as
  #     follow-up issues). Flip these to blocking per-language as each suite
  #     is stabilized.
  lang-smoke:
    name: Smoke (${{ matrix.lang }})
    runs-on: ubuntu-latest
    # 30 rather than 20 for the cpp leg: a from-scratch libagenkit.a plus 68 test
    # executables is by far the slowest build here (~6 min in a container
    # locally, and hosted runners are slower). The other legs finish well inside
    # this and the timeout only bounds a hang.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, rust, cpp, csharp, java, scala, zig]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- TypeScript ---
      - name: Set up Node
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: TypeScript install
        if: matrix.lang == 'typescript'
        working-directory: agenkit-ts
        run: npm ci
      - name: TypeScript build (blocking)
        if: matrix.lang == 'typescript'
        working-directory: agenkit-ts
        run: npm run build
      # Blocking as of #658. This was `timeout 300 npm test || true` under
      # continue-on-error, on the belief that TS tests hung retrying an absent
      # Redis. Both halves of that were wrong: the Redis suite self-skips after a
      # 1.5s probe (#648), and the real hang was an async-iterator mock in the
      # Anthropic adapter tests that never reported done. The crutch is what hid
      # it — the run was killed at exactly 300s and `|| true` discarded the
      # result, so a permanently hanging test read as "the TS leg is slow".
      # The suite now completes in ~6s, so a cap buys nothing that
      # timeout-minutes doesn't already provide.
      - name: TypeScript tests (blocking)
        if: matrix.lang == 'typescript'
        working-directory: agenkit-ts
        run: npm test

      # --- Rust ---
      # All four steps are blocking as of #773. Previously this leg was
      # `cargo build` plus `cargo test --lib` under continue-on-error, with no
      # fmt or clippy anywhere in the repo. That combination attested to far less
      # than "Rust tests passed":
      #   - `--lib` runs only the unit tests inside `src/`. It does not build
      #     `tests/` or `examples/`, so 40+ integration files — every
      #     `cross_language_*.rs`, every observability test — were never compiled
      #     or run by any gate.
      #   - `continue-on-error: true` meant even the `--lib` half could not fail
      #     the build.
      # The cost of that was measurable: `cargo clippy --all-targets` failed with
      # six deny-by-default errors that had accumulated invisibly, two of them
      # real defects (a `never_loop` example that ran one of its four advertised
      # phases, and two assertions that were vacuous on unsigned types).
      - name: Set up Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format check (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo fmt --check
      - name: Rust build (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo build --quiet
      # --all-targets so lints apply to tests/ and examples/ too — that is where
      # every error found in #773 lived. `-D warnings` as of #778, which cleared
      # the backlog that made the flip impossible: 365 unique warnings across all
      # targets when #773 landed (the "~200" written here then was an eyeball
      # estimate off unfiltered output, which double-counts across lib/test
      # targets — count with --message-format=json deduped on code+location).
      #
      # Deliberately not --all-features. `native` and `wasm` are mutually
      # exclusive, so enabling both fails to compile with 11 errors — that
      # predates #778 and is why this gate uses the default feature set. The
      # consequence is that wasm-gated code is not warning-clean and is not
      # checked here.
      - name: Rust clippy (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo clippy --all-targets -- -D warnings
      # --all-targets, not --lib: this is the step that actually runs the
      # integration suite (1269 tests).
      - name: Rust tests (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo test --all-targets --quiet
      # `--all-targets` silently excludes doctests, so this is a separate step,
      # not a flag. 165 of them document the public API and 6 were wrong as
      # recently as #772. Runs with `opentelemetry` because the observability
      # doctests are feature-gated out of the default build.
      - name: Rust doctests (blocking)
        if: matrix.lang == 'rust'
        working-directory: agenkit-rust
        run: cargo test --doc --features opentelemetry --quiet

      # --- C++ ---
      # agenkit-cpp had no CI at all until #742: cpp-ci.yml was caught in a
      # blanket *.disabled rename in Jan 2026 (c1e1c41a) and never re-enabled,
      # and cpp was missing from this matrix. The library was therefore only
      # ever compiled by Apple clang, and the first GCC build failed on three
      # separate latent defects — a maybe-uninitialized double and missing
      # <mutex>/<cmath> includes that libc++ supplies transitively but
      # libstdc++ does not. This leg is what keeps that from recurring.
      - name: Install C++ dependencies
        if: matrix.lang == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev
      - name: C++ configure
        if: matrix.lang == 'cpp'
        working-directory: agenkit-cpp
        # Examples and benchmarks off: the build is the slowest in the repo and
        # neither adds signal the library+tests don't already give. Integration
        # tests are already OFF by default (they need live services).
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAGENKIT_BUILD_TESTS=ON \
            -DAGENKIT_BUILD_EXAMPLES=OFF \
            -DAGENKIT_BUILD_BENCHMARKS=OFF
      - name: C++ build (blocking)
        if: matrix.lang == 'cpp'
        working-directory: agenkit-cpp
        run: cmake --build build -j"$(nproc)"
      - name: C++ tests (non-blocking)
        if: matrix.lang == 'cpp'
        continue-on-error: true
        working-directory: agenkit-cpp/build
        # Non-blocking to match every other language here. All 68 executables
        # pass under GCC 13.3/libstdc++ locally (verified in a ubuntu:24.04
        # container), so this should be green — but it's the first time the C++
        # suite has ever run in CI and a few tests are timing-sensitive, so
        # treat the results as informational until it's proven itself on hosted
        # runners. Flip to blocking once it has.
        run: ctest --output-on-failure

      # --- C# / .NET ---
      - name: Set up .NET
        if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: C# build (blocking)
        if: matrix.lang == 'csharp'
        run: dotnet build agenkit-cs/Agenkit.sln --nologo -v q
      - name: C# tests (non-blocking)
        if: matrix.lang == 'csharp'
        continue-on-error: true
        run: dotnet test agenkit-cs/Agenkit.sln --nologo -q --no-build

      # --- Java ---
      - name: Set up JDK
        if: matrix.lang == 'java'
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Java compile (blocking)
        if: matrix.lang == 'java'
        working-directory: agenkit-java
        run: mvn -B -q test-compile
      - name: Java tests (non-blocking)
        if: matrix.lang == 'java'
        continue-on-error: true
        working-directory: agenkit-java
        run: mvn -B -q test

      # --- Scala ---
      - name: Set up JDK (Scala)
        if: matrix.lang == 'scala'
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up sbt
        if: matrix.lang == 'scala'
        uses: sbt/setup-sbt@v1
      - name: Scala compile (blocking)
        if: matrix.lang == 'scala'
        working-directory: agenkit-scala
        run: sbt -batch "Test/compile"
      - name: Scala tests (non-blocking)
        if: matrix.lang == 'scala'
        continue-on-error: true
        working-directory: agenkit-scala
        run: sbt -batch test

      # --- Zig ---
      - name: Set up Zig
        if: matrix.lang == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          # Matches build.zig.zon .minimum_zig_version
          version: 0.16.0
      # `zig build test` builds + runs the library/test modules. Migrated to
      # Zig 0.16.0 (#646), so this is the real compile+test gate.
      - name: Zig build + test (blocking)
        if: matrix.lang == 'zig'
        working-directory: agenkit-zig
        run: zig build test

  # Guard against build artifacts re-entering the tracked tree.
  #
  # Between v0.82.0 and v0.85.0 this repo tracked ~1 GB of compiled output: 20 MB
  # Go example binaries (`main`, `websocket`, `router_pattern`, … — no extensions,
  # so no filename pattern would have caught them), Rust incremental-compilation
  # caches, Zig object files. That made the published Go module un-`go get`-able
  # against the proxy's 500 MB zip ceiling (#660). They were removed by hand in
  # v0.86.0 — 1052.6 MB -> 48.9 MB — but nothing stopped a recurrence.
  #
  # Seconds to run and needs no toolchain, so it's blocking: a tracked ELF/Mach-O
  # binary is never a judgement call.
  artifact-guard:
    name: Tracked Artifact Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check for tracked build artifacts
        run: ./scripts/check-tracked-artifacts.sh

  # Compile gates for the remaining cross-language test harnesses. The Go
  # harness is gated in the smoke-test job above; these are the other four.
  #
  # Every harness builds against its language's agenkit core via a local path
  # dependency, and none of them is exercised by any test suite, so a core API
  # change breaks them silently. That has already happened twice: #662 (a Go
  # API change, masked by a prebuilt binary) and #686 (harness_rust's committed
  # Cargo.lock stale at otel 0.22 for ~50 releases). Compile-only is the right
  # depth here — the harnesses are driven by the Python cross-language suite,
  # which runs locally via `make test`; CI just needs to prove they still build.
  #
  # Blocking, unlike the lang-smoke test steps: a harness either compiles or it
  # doesn't, so there is no flakiness to absorb.
  harness-gate:
    name: Harness Build (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        harness: [typescript, rust, cpp, zig]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- TypeScript harness ---
      # Depends on agenkit-ts via `file:../../../agenkit-ts`, so the core has to
      # be built first — npm links the source tree, not a published tarball.
      - name: Set up Node
        if: matrix.harness == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build agenkit-ts core
        if: matrix.harness == 'typescript'
        working-directory: agenkit-ts
        run: |
          npm ci
          npm run build
      - name: Build TypeScript harness (blocking)
        if: matrix.harness == 'typescript'
        working-directory: tests/cross_language/harness_ts
        # `npm ci` rather than `npm install`: the harness has a committed
        # package-lock.json, and ci fails loudly if it has drifted from
        # package.json instead of silently rewriting it.
        run: |
          npm ci
          npm run build

      # --- Rust harness ---
      - name: Set up Rust
        if: matrix.harness == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust harness (blocking)
        if: matrix.harness == 'rust'
        working-directory: tests/cross_language/harness_rust
        # --locked so a stale committed Cargo.lock fails the build instead of
        # being silently regenerated — that silence is exactly what let #686
        # sit at otel 0.22.1 while agenkit-rust moved to 0.32.
        run: cargo build --locked --quiet

      # --- C++ harness ---
      # The harness CMakeLists falls back to building agenkit from source when
      # no prebuilt libagenkit is present, which is what happens here. The
      # library itself is gated by the cpp leg of lang-smoke above (#742); this
      # leg only proves the harness's own translation unit still compiles
      # against it.
      - name: Install C++ dependencies
        if: matrix.harness == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nlohmann-json3-dev
      - name: Build C++ harness (blocking)
        if: matrix.harness == 'cpp'
        working-directory: tests/cross_language/harness_cpp
        # Only the harness target: the agenkit-cpp subproject also defines
        # examples, tests and benchmarks, and building those here would
        # duplicate work for no added signal.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target harness_cpp -j"$(nproc)"

      # --- Zig harness ---
      - name: Set up Zig
        if: matrix.harness == 'zig'
        uses: mlugg/setup-zig@v2
        with:
          # Matches agenkit-zig's build.zig.zon .minimum_zig_version
          version: 0.16.0
      - name: Build Zig harness (blocking)
        if: matrix.harness == 'zig'
        working-directory: tests/cross_language/harness_zig
        run: zig build

  # Build gate for the browser examples (examples/browser/*).
  #
  # These four could never have worked: @agenkit/wasm had a static top-level
  # `import ... from 'fs'` that no bundler can resolve for a browser target, and
  # getModulePath() built paths from `__dirname`, which doesn't exist in an ES
  # module or a browser. On top of that, all four vite/astro aliases were
  # filesystem-absolute ('/../../packages/wasm/...'), three index.html imports
  # were off by a directory level, and react-example referenced an uncommitted
  # tsconfig.node.json. Nothing caught any of it because wasm-ci.yml — the only
  # workflow referencing examples/browser/** — has been .disabled since Jan 2026
  # (see #742). Fixed in #735.
  #
  # A build gate rather than wasm-ci.yml's 7 jobs of Playwright across three
  # browsers: every defect above was a build failure, so this catches the whole
  # class at a fraction of the cost. Browser-runtime testing can come later.
  #
  # `npm run build` triggers each example's prebuild -> prepare-wasm, which
  # builds packages/wasm and copies the .wasm binaries into public/wasm, so this
  # exercises the documented reader path end to end.
  browser-examples:
    name: Browser Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: [react, svelte, vue, astro]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: these examples have no committed lockfiles
      # (they're gitignored for examples — see .gitignore), so there is nothing
      # for `ci` to install from.
      - name: Install packages/wasm dependencies
        working-directory: packages/wasm
        run: npm ci
      - name: Install example dependencies
        working-directory: examples/browser/${{ matrix.example }}-example
        run: npm install
      - name: Build example (blocking)
        working-directory: examples/browser/${{ matrix.example }}-example
        run: npm run build

  # Redis-backed tests (Python + TypeScript RedisMemory). These suites skip
  # themselves when no Redis server is reachable, so they never gated anything
  # in CI. A redis:7-alpine service container makes them actually run. Hosted
  # ubuntu only (both push and PR): keeps untrusted PR code off the LAN runners
  # and the hosted image has Docker for the service container. Separate job so
  # the smoke/lang jobs stay fast and unaffected. (#648)
  redis-tests:
    name: Redis Tests (Python + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # --- Python RedisMemory tests ---
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.13 + redis extra
        run: |
          uv python install 3.13
          uv sync --extra test --extra redis --python 3.13
      - name: Run Python RedisMemory tests
        run: uv run pytest tests/memory/test_redis_memory.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      # --- TypeScript RedisMemory tests ---
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: TypeScript RedisMemory tests
        working-directory: agenkit-ts
        run: |
          npm ci
          npx vitest run src/__tests__/memory/redis.test.ts

