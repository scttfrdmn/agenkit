# Pre-commit hooks for Agenkit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-all
        args: [--config-file=pyproject.toml]
        files: ^agenkit/

  # Go linting and formatting
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.6.1
    hooks:
      - id: golangci-lint
        entry: bash -c 'cd agenkit-go && golangci-lint run --fix'
        pass_filenames: false

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        args: [-w]
        files: ^agenkit-go/

  # Rust formatting (#773). Python and Go had formatter hooks here from the
  # start; Rust had none, and 99 of 224 .rs files had drifted out of format by
  # the time anyone checked. A local hook rather than a mirror repo so it uses
  # the toolchain already installed, and so it picks up agenkit-rust/rustfmt.toml
  # (which pins edition 2021 — without it, bare `rustfmt` assumes 2015 and cannot
  # even parse `async fn`).
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (Rust formatter)
        entry: bash -c 'cd agenkit-rust && cargo fmt'
        language: system
        files: ^agenkit-rust/.*\.rs$
        pass_filenames: false

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, agenkit]
        additional_dependencies: ["bandit[toml]"]

default_install_hook_types: [pre-commit, pre-push]
