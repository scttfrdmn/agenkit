[package]
name = "agenkit"
version = "0.90.0"
edition = "2021"
authors = ["Agenkit Contributors"]
description = "Minimal, composable interfaces for AI agents in Rust"
license = "Apache-2.0"
repository = "https://github.com/scttfrdmn/agenkit"
keywords = ["ai", "agents", "llm", "framework"]
categories = ["web-programming", "asynchronous"]
documentation = "https://docs.rs/agenkit"
readme = "README.md"
homepage = "https://agenkit.dev"

[package.metadata.docs.rs]
all-features = false
features = ["native"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-mutable-globals"]

[profile.release]
# Optimize for size
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization at cost of compile time
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary, no unwinding

[profile.release.package."*"]
opt-level = "z"     # Optimize dependencies for size too

[profile.bench]
# Benchmarks need panic = "unwind" for proper unwinding
panic = "unwind"
opt-level = 3

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# WASM async runtime (alternative to tokio for WASM)
wasm-bindgen-futures = { version = "0.4", optional = true }

# HTTP client and server
reqwest = { version = "0.13", features = ["json"], optional = true }
axum = { version = "0.8", features = ["json"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["trace", "cors"], optional = true }

# WebSocket client and server
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }

# gRPC client and server
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Regex for pattern parsing
regex = "1.10"

# UUID generation
uuid = { version = "1.6", features = ["v4", "js"] }

# Random number generation
rand = "0.10"
getrandom = { version = "0.2", features = ["js"], optional = true }

# Statistical functions for evaluation
statrs = "0.19"

# Performance optimizations
lru = { version = "0.18", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
crossbeam = { version = "0.8", optional = true }
rayon = { version = "1.8", optional = true }
lazy_static = { version = "1.4", optional = true }
parking_lot = { version = "0.12", optional = true }

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# OpenTelemetry Core
opentelemetry = { version = "0.32", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics", "logs", "rt-tokio"], optional = true }

# OpenTelemetry Tracing Integration
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["trace", "metrics", "logs", "grpc-tonic"], optional = true }

# OpenTelemetry Exporters
# NOTE: opentelemetry-jaeger (deprecated upstream; Jaeger ingests OTLP natively),
# opentelemetry-zipkin, opentelemetry-prometheus, and the prometheus client were
# removed — they were unused in the code and pulled in vulnerable transitive
# crates (thrift, protobuf 2.x). The stdout exporter is the only one wired up;
# OTLP remains for the modern export path.
opentelemetry-stdout = { version = "0.32", optional = true }

# Global state management
once_cell = { version = "1.19", optional = true }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console", "Window"], optional = true }
js-sys = { version = "0.3", optional = true }

# WASM-compatible logging
console_error_panic_hook = { version = "0.1", optional = true }
wasm-logger = { version = "0.2", optional = true }

# AWS SDK for Bedrock adapter.
# bedrockruntime's default `rustls` feature pulls the LEGACY smithy TLS
# connector (rustls 0.21 / rustls-webpki 0.101, vulnerable). Its
# `default-https-client` feature already provides a modern TLS stack
# (rustls 0.23 / aws-lc), so we disable default features and drop the
# redundant legacy `rustls` feature.
aws-config = { version = "1.8", optional = true }
aws-sdk-bedrockruntime = { version = "1.135", optional = true, default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-credential-types = { version = "1.2", optional = true }

# Redis for persistent memory
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"], optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"
proptest = "1.4"

# Benchmarking
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }

[features]
default = ["native"]

# OpenTelemetry observability features
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-stdout",
    "dep:once_cell",
]

# Native (non-WASM) build with full features
native = [
    "tokio",
    "tokio-stream",
    "reqwest",
    "axum",
    "tower",
    "tower-http",
    "tokio-tungstenite",
    "futures-util",
    "tonic",
    "prost",
    "tracing-subscriber",
    "opentelemetry",
    "aws-config",
    "aws-sdk-bedrockruntime",
    "aws-credential-types",
    "lru",
    "moka",
    "crossbeam",
    "rayon",
    "lazy_static",
    "parking_lot",
    "redis",
]

# WASM build with browser-compatible features
wasm = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
    "console_error_panic_hook",
    "wasm-logger",
    "getrandom",
]

[lib]
name = "agenkit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

