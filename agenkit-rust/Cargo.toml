[package]
name = "agenkit"
version = "0.48.0"
edition = "2021"
authors = ["Agenkit Contributors"]
description = "Minimal, composable interfaces for AI agents in Rust"
license = "Apache-2.0"
repository = "https://github.com/scttfrdmn/agenkit"
keywords = ["ai", "agents", "llm", "framework"]
categories = ["web-programming", "asynchronous"]
documentation = "https://docs.rs/agenkit"
readme = "README.md"
homepage = "https://agenkit.dev"

[package.metadata.docs.rs]
all-features = false
features = ["native"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-mutable-globals"]

[profile.release]
# Optimize for size
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization at cost of compile time
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary, no unwinding

[profile.release.package."*"]
opt-level = "z"     # Optimize dependencies for size too

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
async-trait = "0.1"
futures = "0.3"

# WASM async runtime (alternative to tokio for WASM)
wasm-bindgen-futures = { version = "0.4", optional = true }

# HTTP client and server
reqwest = { version = "0.11", features = ["json"], optional = true }
axum = { version = "0.7", features = ["json"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["trace", "cors"], optional = true }

# WebSocket client and server
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Regex for pattern parsing
regex = "1.10"

# UUID generation
uuid = { version = "1.6", features = ["v4", "js"] }

# Random number generation
rand = "0.8"
getrandom = { version = "0.2", features = ["js"], optional = true }

# Statistical functions for evaluation
statrs = "0.17"

# Performance optimizations
lru = { version = "0.12", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
crossbeam = { version = "0.8", optional = true }
rayon = { version = "1.8", optional = true }
lazy_static = { version = "1.4", optional = true }
parking_lot = { version = "0.12", optional = true }

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

# OpenTelemetry Core
opentelemetry = { version = "0.23", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "0.23", features = ["trace", "metrics", "logs", "rt-tokio"], optional = true }

# OpenTelemetry Tracing Integration
tracing-opentelemetry = { version = "0.23", optional = true }
opentelemetry-otlp = { version = "0.16", features = ["trace", "metrics", "logs", "grpc-tonic"], optional = true }

# OpenTelemetry Exporters
opentelemetry-jaeger = { version = "0.22", features = ["rt-tokio"], optional = true }
opentelemetry-zipkin = { version = "0.21", features = ["reqwest-client"], optional = true }
opentelemetry-prometheus = { version = "0.16", optional = true }
opentelemetry-stdout = { version = "0.4", optional = true }

# Prometheus client for metrics registry
prometheus = { version = "0.13", optional = true }

# Global state management
once_cell = { version = "1.19", optional = true }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console", "Window"], optional = true }
js-sys = { version = "0.3", optional = true }

# WASM-compatible logging
console_error_panic_hook = { version = "0.1", optional = true }
wasm-logger = { version = "0.2", optional = true }

# AWS SDK for Bedrock adapter
aws-config = { version = "1.5", optional = true }
aws-sdk-bedrockruntime = { version = "1.56", optional = true }
aws-credential-types = { version = "1.2", optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"

# Benchmarking
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[features]
default = ["native"]

# Native (non-WASM) build with full features
native = [
    "tokio",
    "tokio-stream",
    "reqwest",
    "axum",
    "tower",
    "tower-http",
    "tokio-tungstenite",
    "futures-util",
    "tracing-subscriber",
    "opentelemetry",
    "opentelemetry_sdk",
    "tracing-opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry-jaeger",
    "opentelemetry-zipkin",
    "opentelemetry-prometheus",
    "opentelemetry-stdout",
    "prometheus",
    "once_cell",
    "aws-config",
    "aws-sdk-bedrockruntime",
    "aws-credential-types",
    "lru",
    "moka",
    "crossbeam",
    "rayon",
    "lazy_static",
    "parking_lot",
]

# WASM build with browser-compatible features
wasm = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
    "console_error_panic_hook",
    "wasm-logger",
    "getrandom",
]

[lib]
name = "agenkit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cross_language_harness"
path = "tests/cross_language_harness.rs"

