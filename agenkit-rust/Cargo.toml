[package]
name = "agenkit"
version = "0.1.0"
edition = "2021"
authors = ["Agenkit Contributors"]
description = "Minimal, composable interfaces for AI agents in Rust"
license = "MIT"
repository = "https://github.com/scttfrdmn/agenkit"
keywords = ["ai", "agents", "llm", "framework"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# HTTP client and server
reqwest = { version = "0.11", features = ["json"] }
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Regex for pattern parsing
regex = "1.10"

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.2"

[lib]
name = "agenkit"
path = "src/lib.rs"

[[example]]
name = "echo_agent"
path = "examples/echo_agent.rs"

[[example]]
name = "http_transport"
path = "examples/http_transport.rs"

[[example]]
name = "reflection_pattern"
path = "examples/reflection_pattern.rs"

[[example]]
name = "agents_as_tools"
path = "examples/agents_as_tools.rs"

[[example]]
name = "orchestration"
path = "examples/orchestration.rs"

[[example]]
name = "react_pattern"
path = "examples/react_pattern.rs"

[[example]]
name = "planning_pattern"
path = "examples/planning_pattern.rs"

[[example]]
name = "conversational_pattern"
path = "examples/conversational_pattern.rs"
