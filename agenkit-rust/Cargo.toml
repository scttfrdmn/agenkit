[[example]]
name = "react_pattern"
path = "examples/react-pattern.rs"

[[example]]
name = "planning_pattern"
path = "examples/planning-pattern.rs"

[[example]]
name = "conversational_pattern"
path = "examples/conversational-pattern.rs"

[[example]]
name = "task_pattern"
path = "examples/task-pattern.rs"

[[example]]
name = "multiagent_pattern"
path = "examples/multiagent-pattern.rs"

[[example]]
name = "autonomous_pattern"
