[package]
name = "agenkit"
version = "0.1.0"
edition = "2021"
authors = ["Agenkit Contributors"]
description = "Minimal, composable interfaces for AI agents in Rust"
license = "Apache-2.0"
repository = "https://github.com/scttfrdmn/agenkit"
keywords = ["ai", "agents", "llm", "framework"]
categories = ["web-programming", "asynchronous"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-mutable-globals"]

[profile.release]
# Optimize for size
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization at cost of compile time
strip = true        # Strip debug symbols
panic = "abort"     # Smaller binary, no unwinding

[profile.release.package."*"]
opt-level = "z"     # Optimize dependencies for size too

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"], optional = true }
async-trait = "0.1"
futures = "0.3"

# WASM async runtime (alternative to tokio for WASM)
wasm-bindgen-futures = { version = "0.4", optional = true }

# HTTP client and server
reqwest = { version = "0.11", features = ["json"], optional = true }
axum = { version = "0.7", features = ["json"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["trace", "cors"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Regex for pattern parsing
regex = "1.10"

# UUID generation
uuid = { version = "1.6", features = ["v4", "js"] }

# Random number generation
rand = "0.8"
getrandom = { version = "0.2", features = ["js"], optional = true }

# Tracing and logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console", "Window"], optional = true }
js-sys = { version = "0.3", optional = true }

# WASM-compatible logging
console_error_panic_hook = { version = "0.1", optional = true }
wasm-logger = { version = "0.2", optional = true }

# AWS SDK for Bedrock adapter
aws-config = { version = "1.5", optional = true }
aws-sdk-bedrockruntime = { version = "1.56", optional = true }
aws-credential-types = { version = "1.2", optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1.2"

[features]
default = ["native"]

# Native (non-WASM) build with full features
native = [
    "tokio",
    "reqwest",
    "axum",
    "tower",
    "tower-http",
    "tracing-subscriber",
    "aws-config",
    "aws-sdk-bedrockruntime",
    "aws-credential-types",
]

# WASM build with browser-compatible features
wasm = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
    "console_error_panic_hook",
    "wasm-logger",
    "getrandom",
]

[lib]
name = "agenkit"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cross_language_harness"
path = "tests/cross_language_harness.rs"

[[example]]
name = "echo_agent"
path = "examples/echo_agent.rs"

[[example]]
name = "http_transport"
path = "examples/http_transport.rs"

[[example]]
name = "reflection_pattern"
path = "examples/reflection_pattern.rs"

[[example]]
name = "agents_as_tools"
path = "examples/agents_as_tools.rs"

[[example]]
name = "orchestration"
path = "examples/orchestration.rs"

[[example]]
name = "react_pattern"
path = "examples/react_pattern.rs"

[[example]]
name = "planning_pattern"
path = "examples/planning_pattern.rs"

[[example]]
name = "conversational_pattern"
path = "examples/conversational_pattern.rs"

[[example]]
name = "task_pattern"
path = "examples/task_pattern.rs"

[[example]]
name = "multiagent_pattern"
path = "examples/multiagent_pattern.rs"

[[example]]
name = "autonomous_pattern"
path = "examples/autonomous_pattern.rs"

[[example]]
name = "memory_hierarchy_pattern"
path = "examples/memory_hierarchy_pattern.rs"

[[example]]
name = "reasoning_with_tools_pattern"
path = "examples/reasoning_with_tools_pattern.rs"

[[example]]
name = "litellm_example"
path = "examples/litellm_example.rs"

[[example]]
name = "gemini_example"
path = "examples/gemini_example.rs"

[[example]]
name = "bedrock_example"
path = "examples/bedrock_example.rs"
