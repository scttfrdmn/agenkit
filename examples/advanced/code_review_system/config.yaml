# Code Review System Configuration

# Review settings
review:
  # Reviewers to include (security, performance, maintainability)
  reviewers:
    - security
    - performance
    - maintainability

  # Number of debate rounds (1-3)
  debate_rounds: 2

  # Consensus thresholds by severity
  consensus:
    blocker: 1.0    # Unanimous agreement required (100%)
    major: 0.67     # 2/3 majority required
    minor: 0.5      # Simple majority (50%)

  # Enable automated linting tools
  enable_linters: true

  # Supported languages
  languages:
    - python
    - go
    - typescript
    - rust
    - cpp
    - zig

# Linter configurations
linters:
  python:
    - ruff
    - mypy
    - bandit

  go:
    - golangci-lint
    - go vet

  typescript:
    - eslint
    - prettier
    - tsc

  rust:
    - clippy
    - rustfmt

  cpp:
    - clang-tidy
    - cppcheck

  zig:
    - zig fmt

# Reflection settings
reflection:
  # Enable reflection for review quality improvement
  enabled: true

  # Maximum reflection rounds
  max_rounds: 2

  # Quality score threshold (0.0-1.0)
  quality_threshold: 0.85

# Output settings
output:
  # Output format (markdown, json, github_comment)
  format: markdown

  # Include code snippets in review
  include_snippets: true

  # Include line numbers
  include_line_numbers: true

  # Verbosity level (quiet, normal, verbose)
  verbosity: normal

  # Output directory for reports
  output_dir: ./review_reports

# LLM settings
llm:
  # Model for reviewers
  reviewer_model: gpt-4o-mini

  # Model for consensus building
  consensus_model: gpt-4o

  # Temperature
  temperature: 0.5

  # Max tokens per review
  max_tokens: 3000

# GitHub integration (optional)
github:
  # Auto-comment on PRs
  auto_comment: false

  # Require approval for merge
  require_approval: true

  # Labels to add based on decision
  labels:
    approve: ["approved", "ready-to-merge"]
    approve_with_comments: ["approved", "suggestions"]
    request_changes: ["changes-requested"]
    reject: ["blocked"]
