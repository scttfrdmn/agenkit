<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Code Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1000px;margin:0 auto}
.header{background:#fff;border-radius:12px 12px 0 0;padding:25px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
h1{color:#333;font-size:24px}
.chat{background:#fff;height:600px;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:20px;background:#f7fafc}
.message{margin-bottom:15px;animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message-content{padding:12px 16px;border-radius:8px;max-width:80%}
.message.user .message-content{background:#667eea;color:#fff;margin-left:auto}
.message.agent .message-content{background:#fff;color:#333;border:1px solid #e2e8f0;white-space:pre-wrap}
.quick-prompts{display:flex;gap:10px;padding:15px;background:#fff;border-top:1px solid #e2e8f0;flex-wrap:wrap}
.quick-prompt{padding:8px 12px;background:#f7fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;cursor:pointer;transition:.3s}
.quick-prompt:hover{background:#667eea;color:#fff}
.input-area{display:flex;gap:10px;padding:20px;background:#fff;border-radius:0 0 12px 12px}
.input-area input{flex:1;padding:12px;border:2px solid #e2e8f0;border-radius:6px}
.input-area input:focus{outline:none;border-color:#667eea}
.input-area button{padding:12px 24px;background:#667eea;color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.input-area button:hover{background:#5568d3}
</style>
</head><body>
<div class="container">
<div class="header"><h1>💻 Code Assistant</h1></div>
<div class="chat">
<div class="messages" id="messages"></div>
<div class="quick-prompts">
<div class="quick-prompt" onclick="send('Generate Python code for Fibonacci')">🐍 Python Fibonacci</div>
<div class="quick-prompt" onclick="send('Create JavaScript API endpoint')">🟨 JS API</div>
<div class="quick-prompt" onclick="send('Explain async in Python')">📖 Docs</div>
<div class="quick-prompt" onclick="send('Help me debug this error')">🐛 Debug Help</div>
</div>
<div class="input-area">
<input id="input" placeholder="Ask about code..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
</div>
</div>
<script src="client.js"></script>
</body></html>
