name: Customer Support CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/apps/customer-support/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'examples/apps/customer-support/**'

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: examples/apps/customer-support/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        working-directory: examples/apps/customer-support
        run: |
          pytest tests/unit/ -v --cov=python --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./examples/apps/customer-support/coverage.xml
          flags: python

  test-go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        working-directory: examples/apps/customer-support/go
        run: go mod download

      - name: Run Go tests
        working-directory: examples/apps/customer-support/go
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./examples/apps/customer-support/go/coverage.out
          flags: go

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-python, test-go]

    steps:
      - uses: actions/checkout@v3

      - name: Start services with Docker Compose
        working-directory: examples/apps/customer-support
        run: |
          docker-compose up -d
          sleep 30  # Wait for services to be ready

      - name: Check service health
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8000/health

      - name: Run integration tests
        working-directory: examples/apps/customer-support
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/integration/ -v

      - name: Run E2E tests
        working-directory: examples/apps/customer-support
        run: |
          pytest tests/e2e/ -v

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose -f examples/apps/customer-support/docker-compose.yml logs

      - name: Stop services
        if: always()
        working-directory: examples/apps/customer-support
        run: docker-compose down

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ruff black mypy

      - name: Run ruff
        working-directory: examples/apps/customer-support/python
        run: ruff check .

      - name: Run black
        working-directory: examples/apps/customer-support/python
        run: black --check .

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: examples/apps/customer-support/go
