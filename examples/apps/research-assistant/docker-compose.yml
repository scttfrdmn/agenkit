version: '3.8'

services:
  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: research-assistant-api
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GO_SCRAPER_ENDPOINT=grpc://go-scraper:${GO_SCRAPER_GRPC_PORT:-50051}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-research_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-research}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - TIMEOUT_RESEARCH=${TIMEOUT_RESEARCH:-180.0}
      - RATE_LIMIT_USER_RATE=${RATE_LIMIT_USER_RATE:-5.0}
    depends_on:
      - go-scraper
      - postgres
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network

  go-scraper:
    build:
      # Repo root: go/go.mod `replace`s agenkit-go to ../../../../agenkit-go, which
      # a context of ./go excludes — `go mod download` could not see it (#857).
      context: ../../..
      dockerfile: examples/apps/research-assistant/go/Dockerfile
    container_name: research-assistant-scraper
    ports:
      - "${GO_SCRAPER_GRPC_PORT:-50051}:50051"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network

  postgres:
    image: postgres:15-alpine
    container_name: research-assistant-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-research_assistant}
      - POSTGRES_USER=${POSTGRES_USER:-research}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-network

  prometheus:
    image: prom/prometheus:latest
    container_name: research-assistant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - research-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: research-assistant-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - research-network

volumes:
  postgres-data:
  prometheus-data:

networks:
  research-network:
    driver: bridge
