<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenkit WASM + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Exposes createZigAgent on window for the app component, which declares
         it rather than importing it. Uses the '@agenkit/wasm' alias from the
         vite config: the previous '../../packages/wasm/dist/index.mjs' was off
         by one directory level (it resolved to examples/packages/wasm/...) and
         so failed even once the package had been built (#735). -->
    <script type="module">
      import { createZigAgent } from '@agenkit/wasm';
      window.createZigAgent = createZigAgent;
    </script>
  </body>
</html>
