version: '3.9'

# ============================================================
# Agenkit Production Docker Compose Configuration
# ============================================================
#
# This configuration provides a complete production-ready deployment with:
# - Multi-runtime agent services (Python & Go)
# - Load balancer (Nginx)
# - State management (Redis)
# - Persistence (PostgreSQL)
# - Observability stack (Prometheus, Grafana, Jaeger)
# - Health checks and auto-restart
# - Resource limits
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - API:       http://localhost:8080
#   - Grafana:   http://localhost:3000 (admin/admin)
#   - Prometheus: http://localhost:9090
#   - Jaeger:    http://localhost:16686
# ============================================================

services:
  # ============================================================
  # Agenkit Agent Services
  # ============================================================

  # Python Agent Service
  agenkit-python:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.12
    container_name: agenkit-python
    image: agenkit-python:latest
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      - ENVIRONMENT=production
      - AGENT_TYPE=react
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://agenkit:agenkit_password@postgres:5432/agenkit
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
      - PROMETHEUS_PORT=8001
      # Add your LLM API keys via .env file
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - agenkit-network

    volumes:
      - ./python/logs:/app/logs
      - ./python/data:/app/data

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    labels:
      - "com.agenkit.service=agent"
      - "com.agenkit.runtime=python"
      - "com.agenkit.agent_type=react"

  # Go Agent Service
  agenkit-go:
    build:
      context: ./go
      dockerfile: Dockerfile
      args:
        - GO_VERSION=1.22
    container_name: agenkit-go
    image: agenkit-go:latest
    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      - ENVIRONMENT=production
      - AGENT_TYPE=conversational
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://agenkit:agenkit_password@postgres:5432/agenkit
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
      - PROMETHEUS_PORT=8002

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - agenkit-network

    volumes:
      - ./go/logs:/app/logs
      - ./go/data:/app/data

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    labels:
      - "com.agenkit.service=agent"
      - "com.agenkit.runtime=go"
      - "com.agenkit.agent_type=conversational"

  # ============================================================
  # Load Balancer
  # ============================================================

  nginx:
    image: nginx:1.25-alpine
    container_name: agenkit-nginx
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx

    depends_on:
      - agenkit-python
      - agenkit-go

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=loadbalancer"

  # ============================================================
  # Data & State Management
  # ============================================================

  # Redis for caching and session management
  redis:
    image: redis:7.2-alpine
    container_name: agenkit-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-agenkit_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec

    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - agenkit-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

    labels:
      - "com.agenkit.service=cache"

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: agenkit-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_DB=agenkit
      - POSTGRES_USER=agenkit
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agenkit_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenkit -d agenkit"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agenkit-network

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    labels:
      - "com.agenkit.service=database"

  # ============================================================
  # Observability: Metrics (Prometheus + Grafana)
  # ============================================================

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.48
    container_name: agenkit-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      - agenkit-python
      - agenkit-go

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=monitoring"

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: agenkit-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=monitoring"

  # ============================================================
  # Observability: Tracing (Jaeger)
  # ============================================================

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: agenkit-jaeger
    restart: unless-stopped

    ports:
      - "5775:5775/udp"   # accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp"   # accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"   # accept jaeger.thrift over binary thrift protocol
      - "5778:5778"       # serve configs
      - "16686:16686"     # serve frontend
      - "14268:14268"     # accept jaeger.thrift directly from clients
      - "14250:14250"     # accept model.proto
      - "9411:9411"       # Zipkin compatible endpoint

    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key

    volumes:
      - jaeger-data:/badger

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=tracing"

  # ============================================================
  # Observability: Node Exporter (Host Metrics)
  # ============================================================

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: agenkit-node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=monitoring"

  # ============================================================
  # Observability: cAdvisor (Container Metrics)
  # ============================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: agenkit-cadvisor
    restart: unless-stopped

    ports:
      - "8082:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    privileged: true

    networks:
      - agenkit-network

    labels:
      - "com.agenkit.service=monitoring"

# ============================================================
# Networks
# ============================================================

networks:
  agenkit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================
# Volumes
# ============================================================

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
