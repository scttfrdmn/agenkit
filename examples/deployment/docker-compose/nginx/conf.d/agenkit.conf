# ============================================================
# Agenkit API Server Configuration
# ============================================================

# HTTP Server (Port 80)
server {
    listen 80;
    server_name agenkit.local localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Root location
    location / {
        return 200 '{"status": "healthy", "service": "agenkit", "version": "0.45.0"}';
        add_header Content-Type application/json;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status": "ok"}';
        add_header Content-Type application/json;
    }

    # Metrics endpoint (Prometheus)
    location /metrics {
        access_log off;
        proxy_pass http://agenkit_python/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Python Agent API
    location /api/python/ {
        limit_req zone=api burst=10 nodelay;

        rewrite ^/api/python/(.*) /$1 break;

        proxy_pass http://agenkit_python;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Error handling
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Go Agent API
    location /api/go/ {
        limit_req zone=api burst=10 nodelay;

        rewrite ^/api/go/(.*) /$1 break;

        proxy_pass http://agenkit_go;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Default API (Round-robin load balancing)
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        # Round-robin between Python and Go
        if ($request_id ~* "^[0-4]") {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://agenkit_python;
        }
        if ($request_id ~* "^[5-9a-f]") {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://agenkit_go;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # WebSocket support (for streaming responses)
    location /ws {
        proxy_pass http://agenkit_python;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        return 500 '{"error": "Internal server error", "status": 500}';
        add_header Content-Type application/json;
    }

    location = /404.html {
        return 404 '{"error": "Not found", "status": 404}';
        add_header Content-Type application/json;
    }
}

