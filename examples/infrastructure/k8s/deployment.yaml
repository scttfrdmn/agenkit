apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenkit-production
  labels:
    app: agenkit
    component: production-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agenkit
      component: production-agent
  template:
    metadata:
      labels:
        app: agenkit
        component: production-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: agent
        image: agenkit/production-agent:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP

        # Environment configuration
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: LOAD_BALANCER_STRATEGY
          value: "least_connections"
        - name: HEALTH_CHECK_INTERVAL
          value: "5s"
        - name: RETRY_MAX_ATTEMPTS
          value: "3"
        - name: BACKPRESSURE_THRESHOLD
          value: "0.3"

        # Resource limits for 30-hour autonomous operation
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Startup probe - allows slow initialization
        # Kubernetes won't check liveness/readiness until this passes
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30  # 5 minutes total (30 * 10s)
          successThreshold: 1

        # Liveness probe - is the process running?
        # Kubernetes will restart the pod if this fails
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 0  # Waits for startup probe
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3  # Restart after 30s of failures
          successThreshold: 1

        # Readiness probe - can it handle traffic?
        # Kubernetes will remove from service if this fails
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 0  # Waits for startup probe
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2  # Remove after 10s of failures
          successThreshold: 1

        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        # Volume mounts for state persistence
        volumeMounts:
        - name: state
          mountPath: /var/lib/agenkit
        - name: tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: agenkit-state
      - name: tmp
        emptyDir: {}

      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - agenkit
              topologyKey: kubernetes.io/hostname

      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: agenkit-production
  labels:
    app: agenkit
    component: production-agent
spec:
  type: ClusterIP
  selector:
    app: agenkit
    component: production-agent
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agenkit-state
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agenkit-production-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: agenkit
      component: production-agent

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agenkit-production-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agenkit-production
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
