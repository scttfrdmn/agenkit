pattern:
  name: "Fallback"
  category: "advanced"
  description: "Try primary agent, fall back to alternative agents on failure"
  version: "1.0.0"
  aliases: ["failover", "backup-agent"]

# Constructor parameters below match the real Python FallbackAgent.__init__
# (agenkit/patterns/fallback.py), corrected by #924's audit. The spec
# previously split the constructor into "primary"/"fallbacks"/
# "retry_primary" params, but the actual implementation takes a single
# flat ordered list of agents (the first element being what the spec
# called "primary") and has no retry-primary concept at all.
interface:
  constructor:
    parameters:
      - name: "agents"
        type: "Agent[]"
        required: true
        description: "Agents to try in order (first element is the primary; must be non-empty)"

behavior:
  execution:
    - step: 1
      action: "Try primary agent"
    - step: 2
      action: "If failure, try first fallback"
    - step: 3
      action: "Continue through fallback chain until success"

  invariants:
    - "Primary attempted first"
    - "Fallbacks tried in order"
    - "First success returned"

error_handling:
  - condition: "All agents fail"
    behavior: "Raise error with all failure details"

test_cases:
  - name: "Primary success"
    description: "Primary agent succeeds"
    assertions:
      - "Primary used"
      - "Fallbacks not invoked"

  - name: "Fallback activation"
    description: "Primary fails, fallback succeeds"
    assertions:
      - "Primary failed"
      - "Fallback succeeded"

performance:
  latency: "Primary time (on success) or primary + fallback times (on failure)"

cross_language_equivalence:
  verified: false
  test_required: true
