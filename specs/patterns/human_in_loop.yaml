pattern:
  name: "HumanInLoop"
  category: "advanced"
  description: "Include human approval or feedback at critical decision points"
  version: "1.0.0"
  aliases: ["human-approval", "interactive-agent"]

# Constructor parameters below match the real Python HumanInLoopConfig
# fields (agenkit/patterns/human_in_loop.py), corrected by #924's audit.
# The spec previously declared "approval_callback" (real field:
# "approval_func") and "require_approval_for" with an enum of scopes, which
# does not exist -- the real implementation gates on a numeric confidence
# threshold read from response metadata, not a set of action-type scopes.
interface:
  constructor:
    parameters:
      - name: "agent"
        type: "Agent"
        required: true
        description: "Agent to wrap with human approval"

      - name: "approval_func"
        type: "function"
        required: true
        description: "Called (sync or async) when human approval is needed; receives an ApprovalRequest and returns an ApprovalResponse"

      - name: "approval_threshold"
        type: "number"
        required: false
        default: 0.8
        description: "Responses with confidence below this threshold require approval (0.0-1.0)"

      - name: "confidence_key"
        type: "string"
        required: false
        default: "confidence"
        description: "Metadata key used to read the agent's confidence value"

behavior:
  execution:
    - step: 1
      action: "Agent generates action"
    - step: 2
      action: "Request human approval if required"
    - step: 3
      action: "Wait for human response"
    - step: 4
      action: "If approved, execute; if rejected, revise"

  invariants:
    - "Human approval required for configured actions"
    - "Execution blocks until approval received"

test_cases:
  - name: "Approval granted"
    description: "Human approves action"
    assertions:
      - "Approval requested"
      - "Action executed after approval"

  - name: "Approval denied"
    description: "Human rejects action"
    assertions:
      - "Action not executed"
      - "Agent revises plan"

performance:
  latency: "Agent time + human response time"

cross_language_equivalence:
  verified: false
  test_required: true
