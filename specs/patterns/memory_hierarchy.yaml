pattern:
  name: "MemoryHierarchy"
  category: "advanced"
  description: "Multi-tier memory management with short-term, long-term, and external storage"
  version: "1.0.0"
  aliases: ["hierarchical-memory", "tiered-memory"]

# Constructor parameters below match the real Python MemoryHierarchy
# fields (agenkit/patterns/memory.py), corrected by #924's audit.
# MemoryHierarchy is not an Agent and takes no "llm" parameter at all --
# it composes three memory-tier instances (each independently
# constructed and configured, e.g. WorkingMemory(max_messages=10),
# ShortTermMemory(max_messages=100, ttl_seconds=3600),
# LongTermMemory(min_importance=0.5)), not raw size/interval numbers.
interface:
  constructor:
    parameters:
      - name: "working_memory"
        type: "WorkingMemory"
        required: true
        description: "Working memory instance (current conversation)"

      - name: "short_term_memory"
        type: "ShortTermMemory"
        required: false
        default: null
        description: "Optional short-term memory instance (recent sessions)"

      - name: "long_term_memory"
        type: "LongTermMemory"
        required: false
        default: null
        description: "Optional long-term memory instance (persistent facts)"

behavior:
  state:
    - name: "short_term_memory"
      type: "Message[]"
      description: "Recent messages"

    - name: "long_term_memory"
      type: "Summary[]"
      description: "Summarized historical context"

  execution:
    - step: 1
      action: "Store new message in short-term"
    - step: 2
      action: "If short-term full, summarize and move to long-term"
    - step: 3
      action: "Retrieve relevant context from both tiers"
    - step: 4
      action: "Process with combined context"

  invariants:
    - "Short-term always most recent"
    - "Long-term contains summaries"
    - "Efficient retrieval from both tiers"

test_cases:
  - name: "Memory tier promotion"
    description: "Old messages summarized and moved"
    assertions:
      - "Short-term size maintained"
      - "Long-term contains summaries"

performance:
  latency: "Single LLM call + retrieval"
  memory: "O(short_term + long_term)"

cross_language_equivalence:
  verified: false
  test_required: true
