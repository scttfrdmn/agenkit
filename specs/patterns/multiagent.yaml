pattern:
  name: "Multiagent"
  category: "advanced"
  description: "Multiple agents collaborate, debate, or vote to solve problems together"
  version: "1.0.0"
  aliases: ["multi-agent-system", "collaborative-agents"]

# Constructor parameters below match the real Python MultiAgentConfig
# fields (agenkit/patterns/multiagent.py), corrected by #924's audit. The
# spec previously declared "agents" as an Agent[] with a "coordination"
# enum including "consensus"/"debate"/"vote" and a "rounds" count -- none
# of which exist on MultiAgentConfig/MultiAgentOrchestrator. "agents" is
# actually a name-keyed map, the strategy enum is
# "sequential"/"parallel"/"delegate", and there is no rounds concept
# (multi-round consensus/voting lives in the separate ConsensusAgent /
# ConsensusConfig, not MultiAgentOrchestrator).
interface:
  constructor:
    parameters:
      - name: "strategy"
        type: "string"
        required: false
        default: "sequential"
        options:
          - "sequential"
          - "parallel"
          - "delegate"

      - name: "agents"
        type: "Map<string, Agent>"
        required: false
        default: {}
        description: "Named agents to register"

behavior:
  execution:
    - step: 1
      action: "Distribute problem to all agents"
    - step: 2
      action: "Each agent processes independently"
    - step: 3
      action: "Apply coordination strategy"
    - step: 4
      action: "Synthesize final answer"

  invariants:
    - "All agents participate"
    - "Coordination protocol followed"
    - "Final result aggregated"

test_cases:
  - name: "Consensus building"
    description: "Agents reach consensus"
    assertions:
      - "All agents contributed"
      - "Consensus achieved"

performance:
  latency: "rounds * max(agent_times)"

cross_language_equivalence:
  verified: false
  test_required: true
