pattern:
  name: "Orchestration"
  category: "specialized"
  description: "Coordinate multiple agents with complex routing, sequencing, and aggregation logic"
  version: "1.0.0"
  aliases: ["workflow-orchestration", "agent-coordinator"]

# The Python reference implementation (agenkit/patterns/orchestration.py's
# OrchestrationConfig) is largely consistent with the parameters below,
# except for a missing "error_strategy" field -- added by #924's audit.
# Note: this module is marked deprecated as of Python v0.43.0 in favor of
# importing SequentialAgent/ParallelAgent/RouterAgent directly from
# agenkit.patterns; OrchestrationAgent itself (the class actually
# matching this spec's workflow/agents/error_strategy shape) remains, but
# the deprecation is a real, separate fact worth flagging here.
interface:
  constructor:
    parameters:
      - name: "workflow"
        type: "WorkflowDefinition[]"
        required: true
        description: "List of workflow stages defining execution flow, routing, and aggregation"

      - name: "agents"
        type: "Map<string, Agent>"
        required: true
        description: "Named agents to orchestrate"

      - name: "error_strategy"
        type: "string"
        required: false
        default: "fail"
        description: "How to handle stage errors"
        options:
          - "fail"
          - "continue"
          - "retry"

behavior:
  execution:
    - step: 1
      action: "Parse workflow definition"
    - step: 2
      action: "Execute agents according to workflow"
    - step: 3
      action: "Handle conditional routing"
    - step: 4
      action: "Aggregate results per workflow spec"

  invariants:
    - "Workflow defines execution order"
    - "Supports sequential, parallel, and conditional flows"

test_cases:
  - name: "Complex workflow execution"
    description: "Multi-stage workflow with conditionals"
    assertions:
      - "Workflow executed correctly"
      - "Conditional branches handled"

performance:
  latency: "Depends on workflow structure"

cross_language_equivalence:
  verified: false
  test_required: true
