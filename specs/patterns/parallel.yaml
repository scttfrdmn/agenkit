pattern:
  name: "Parallel"
  category: "composition"
  description: "Execute multiple agents concurrently on the same input and aggregate their results"
  version: "1.0.0"
  aliases: []

# Constructor parameters below match the real Python ParallelAgent.__init__
# (agenkit/patterns/parallel.py), corrected by #924's audit. The spec
# previously declared "aggregation" as a string enum ("concat"/"vote"/
# "first"/"custom") plus a "name" parameter, neither of which exist --
# the real constructor takes "aggregator" as a required callable
# (`list[Message] -> Message`); string-named strategies aren't a
# constructor option, though `DefaultAggregators` supplies ready-made
# callables (`.first`, `.concatenate`, `.majority_vote`) matching this
# spec's former "first"/"concat"/"vote" behaviors. "name" is a hardcoded
# property ("ParallelAgent"), not configurable.
interface:
  constructor:
    parameters:
      - name: "agents"
        type: "Agent[]"
        required: true
        description: "List of agents to execute in parallel"
        constraints:
          - "Must have at least 1 agent"
          - "All agents receive same input"

      - name: "aggregator"
        type: "function"
        required: true
        description: "Function combining `list[Message]` results into a single `Message`; see DefaultAggregators for ready-made strategies (first, concatenate, majority_vote)"

  methods:
    process:
      input: "Message"
      output: "Message"
      async: true
      description: "Process message through all agents concurrently, then aggregate"

behavior:
  state:
    - name: "agents"
      type: "Agent[]"
      description: "List of agents to execute in parallel"

    - name: "aggregation_strategy"
      type: "string | function"
      description: "Aggregation method to combine results"

  execution:
    - step: 1
      action: "Receive input message"
      preconditions: []
      postconditions: ["Message stored as input"]

    - step: 2
      action: "Spawn concurrent execution for all agents"
      preconditions: ["At least one agent exists"]
      postconditions: ["All agents receive identical input", "All agents execute concurrently"]

    - step: 3
      action: "Wait for all agents to complete"
      preconditions: ["All agents started"]
      postconditions: ["All results collected or errors captured"]

    - step: 4
      action: "Apply aggregation strategy to results"
      preconditions: ["At least one agent succeeded"]
      postconditions: ["Single aggregated result produced"]

    - step: 5
      action: "Return aggregated message"
      preconditions: ["Aggregation complete"]
      postconditions: ["Final message returned"]

  invariants:
    - "All agents receive exactly the same input message"
    - "Agents execute concurrently (not sequentially)"
    - "Execution order is non-deterministic"
    - "All agents execute even if some fail (best effort)"
    - "Aggregation only includes successful results"
    - "Total latency is max(agent_latencies), not sum"

error_handling:
  - condition: "agents array is empty"
    error_type: "ValueError"
    behavior: "Raise error at construction time"

  - condition: "All agents fail"
    error_type: "AgentError"
    behavior: "Raise error with details of all failures"

  - condition: "Some agents fail, some succeed"
    error_type: null
    behavior: "Aggregate successful results, log failures"

  - condition: "Invalid aggregation strategy"
    error_type: "ValueError"
    behavior: "Raise error at construction time"

  - condition: "Custom aggregation function raises error"
    error_type: "AggregationError"
    behavior: "Propagate error with context"

test_cases:
  - name: "Three agents with concat aggregation"
    description: "Run three analysis agents in parallel"
    input:
      message:
        role: "user"
        content: "analyze this"
      config:
        agents: ["sentiment", "entities", "topics"]
        aggregation: "concat"
    expected_output:
      message:
        role: "assistant"
        content: |
          sentiment: positive
          entities: [Apple, iPhone]
          topics: technology
    assertions:
      - "Output contains all three agent results"
      - "Results separated by newlines"
      - "Order may vary (non-deterministic)"

  - name: "Voting aggregation for classification"
    description: "Three classifiers vote on category"
    input:
      message:
        role: "user"
        content: "classify: spam email"
      config:
        agents: ["classifier1", "classifier2", "classifier3"]
        aggregation: "vote"
    expected_output:
      message:
        role: "assistant"
        content: "spam"
      metadata:
        votes: {"spam": 3, "ham": 0}
    assertions:
      - "Majority vote determines output"
      - "Metadata contains vote counts"

  - name: "First successful result"
    description: "Return first agent that succeeds"
    input:
      message:
        role: "user"
        content: "query"
      config:
        agents: ["fast_agent", "slow_agent", "backup_agent"]
        aggregation: "first"
    expected_output:
      message:
        role: "assistant"
        content_from: "fast_agent"
    assertions:
      - "First successful result returned"
      - "Other agents may still be running (but ignored)"

  - name: "Custom aggregation function"
    description: "User-provided aggregation logic"
    input:
      message:
        role: "user"
        content: "calculate"
      config:
        agents: ["calc1", "calc2", "calc3"]
        aggregation: "custom_average"
    expected_output:
      message:
        role: "assistant"
        content: "42"  # Average of 40, 42, 44
    assertions:
      - "Custom function receives all results"
      - "Custom function returns single message"

  - name: "Partial failure handling"
    description: "Some agents fail, some succeed"
    input:
      message:
        role: "user"
        content: "test"
      config:
        agents: ["agent1", "failing_agent", "agent3"]
        aggregation: "concat"
    expected_output:
      message:
        role: "assistant"
        content: |
          agent1: success
          agent3: success
      metadata:
        failures: ["failing_agent"]
    assertions:
      - "Successful results aggregated"
      - "Failures logged in metadata"
      - "No error raised (partial success ok)"

  - name: "All agents fail"
    description: "Complete failure of parallel execution"
    input:
      message:
        role: "user"
        content: "trigger_all_errors"
      config:
        agents: ["failing1", "failing2", "failing3"]
    expected_error:
      type: "AgentError"
      message_contains: "all agents failed"
    assertions:
      - "Error raised when no agents succeed"
      - "Error contains details of all failures"

performance:
  latency: "Max of all agent latencies (not sum)"
  throughput: "N * single_agent_throughput (parallelism speedup)"
  memory: "O(N) - all results stored until aggregation"
  cost: "Sum of all agent costs"
  concurrency: "All agents execute simultaneously"

composition:
  can_be_agent: true
  can_contain:
    - "Any Agent implementation"
    - "Other Parallel agents (nested parallelism)"
    - "Sequential agents"
    - "All pattern types"

examples:
  - language: "Python"
    code: |
      from agenkit.patterns import ParallelAgent, default_aggregators

      parallel = ParallelAgent(
          agents=[sentiment, entities, topics],
          aggregator=default_aggregators.concatenate
      )

      result = await parallel.process(message)

  - language: "Go"
    code: |
      parallel, err := patterns.NewParallelAgent(
          []agenkit.Agent{sentiment, entities, topics},
          patterns.DefaultAggregators.Concatenate,
      )

      result, err := parallel.Process(ctx, message)

  - language: "TypeScript"
    code: |
      const parallel = new ParallelAgent(
          [sentiment, entities, topics],
          (messages) => messages[0]
      );

      const result = await parallel.process(message);

cross_language_equivalence:
  verified: false
  test_required: true
  notes: |
    Output order may vary due to non-deterministic execution.
    Tests should verify set membership, not exact string equality.
    Timing-based tests may be flaky across languages due to different async implementations.
