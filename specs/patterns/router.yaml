pattern:
  name: "Router"
  category: "specialized"
  description: "Route incoming messages to appropriate specialist agents based on content or metadata"
  version: "1.0.0"
  aliases: ["message-router", "dispatcher"]

# Constructor parameters below match the real Python RouterConfig fields
# (agenkit/patterns/router.py), corrected by #924's audit. The spec
# previously called the routing table "routes" (real field: "agents"),
# the fallback "default_agent" (real field: "default_key" -- a string key
# into the agents map, not an Agent instance), and declared a
# "routing_strategy" enum ("keyword"/"llm"/"metadata"/"custom") that
# doesn't exist as a constructor option -- routing decisions are made by
# a required "classifier" object (any agent implementing a `classify()`
# method; `SimpleClassifier` and `LLMClassifier` are the two ready-made
# implementations, corresponding to this spec's former "keyword" and
# "llm" strategy names). "name" is not a constructor parameter
# (RouterAgent.name is a hardcoded property).
interface:
  constructor:
    parameters:
      - name: "classifier"
        type: "Agent"
        required: true
        description: "Determines which agent to route to (implements a classify() method); see SimpleClassifier/LLMClassifier for ready-made implementations"

      - name: "agents"
        type: "Map<string, Agent>"
        required: true
        description: "Maps categories returned by the classifier to specialist agents"

      - name: "default_key"
        type: "string"
        required: false
        default: null
        description: "Key into agents to use when classification doesn't match any category"

  methods:
    process:
      input: "Message"
      output: "Message"
      async: true
      description: "Classify the message via the classifier, then route to the matching (or default) specialist"

behavior:
  state:
    - name: "agents"
      type: "Map<string, Agent>"
      description: "Routing table"

    - name: "classifier"
      type: "Agent"
      description: "Determines which route to take"

  execution:
    - step: 1
      action: "Receive message"
      preconditions: []
      postconditions: ["Message stored"]

    - step: 2
      action: "Apply routing strategy"
      preconditions: ["Message exists", "Routes defined"]
      postconditions: ["Route determined or no match"]

    - step: 3
      action: "Invoke matched specialist agent"
      preconditions: ["Route matched"]
      postconditions: ["Specialist processes message"]

    - step: 4
      action: "If no match, use default agent"
      preconditions: ["No route matched", "Default agent exists"]
      postconditions: ["Default agent processes message"]

    - step: 5
      action: "Return specialist result"
      preconditions: ["Specialist completed"]
      postconditions: ["Result returned"]

  invariants:
    - "Only one agent processes each message"
    - "Routing decision made before agent invocation"
    - "Default agent used only when no explicit route matches"
    - "Routing is deterministic for same input"

error_handling:
  - condition: "No route matches and no default_key configured"
    error_type: "RuntimeError"
    behavior: "Raise error listing available categories"

  - condition: "Specialist agent fails"
    error_type: "RuntimeError"
    behavior: "Propagate error with routing context (category, agent name)"

  - condition: "Classifier raises an exception"
    error_type: "RuntimeError"
    behavior: "Propagate wrapped error immediately (no fallback to default_key)"

test_cases:
  - name: "Keyword-based routing"
    description: "Route based on message keywords, using SimpleClassifier"
    input:
      message:
        role: "user"
        content: "What's the weather today?"
      config:
        agents:
          "weather": "WeatherAgent"
          "stocks": "StockAgent"
        classifier: "SimpleClassifier"
    expected_behavior:
      routed_to: "WeatherAgent"
    assertions:
      - "Keyword 'weather' matched"
      - "WeatherAgent processed message"

  - name: "Default fallback routing"
    description: "Use default when no route matches"
    input:
      message:
        role: "user"
        content: "Tell me a joke"
      config:
        agents: {"weather": "WeatherAgent", "general": "GeneralAgent"}
        default_key: "general"
    expected_behavior:
      routed_to: "GeneralAgent"
    assertions:
      - "No keyword matched"
      - "Default agent used"

  - name: "LLM-based routing"
    description: "Route based on LLM classification of message metadata/content"
    input:
      message:
        role: "user"
        content: "Process this"
        metadata: {"category": "technical"}
      config:
        agents: {"technical": "TechnicalAgent", "sales": "SalesAgent"}
        classifier: "LLMClassifier"
    expected_behavior:
      routed_to: "TechnicalAgent"
    assertions:
      - "Classifier determined 'technical' category"
      - "Correct specialist invoked"

performance:
  latency: "routing_time + specialist_time"
  throughput: "High - single agent invocation"
  memory: "O(N) where N = routes"
  cost: "Routing cost (minimal) + specialist cost"

composition:
  can_be_agent: true
  can_contain:
    - "Specialists: any Agent implementations"

cross_language_equivalence:
  verified: false
  test_required: true
  notes: "Routing logic must be identical. Keyword matching should be case-insensitive and consistent."
