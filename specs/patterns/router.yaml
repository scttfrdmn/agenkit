pattern:
  name: "Router"
  category: "specialized"
  description: "Route incoming messages to appropriate specialist agents based on content or metadata"
  version: "1.0.0"
  aliases: ["message-router", "dispatcher"]

interface:
  constructor:
    parameters:
      - name: "routes"
        type: "Map<string, Agent>"
        required: true
        description: "Mapping of route patterns to specialist agents"

      - name: "default_agent"
        type: "Agent"
        required: false
        default: null
        description: "Fallback agent if no route matches"

      - name: "routing_strategy"
        type: "string | function"
        required: false
        default: "keyword"
        description: "How to determine routing"
        options:
          - "keyword": "Match keywords in message"
          - "llm": "Use LLM to classify"
          - "metadata": "Route based on message metadata"
          - "custom": "User-provided routing function"

      - name: "name"
        type: "string"
        required: false
        default: "router"

  methods:
    process:
      input: "Message"
      output: "Message"
      async: true
      description: "Route message to appropriate specialist"

    get_routes:
      output: "Map<string, Agent>"
      description: "Get routing table"

behavior:
  state:
    - name: "routes"
      type: "Map<string, Agent>"
      description: "Routing table"

    - name: "routing_strategy"
      type: "function"
      description: "Function that determines which route to take"

  execution:
    - step: 1
      action: "Receive message"
      preconditions: []
      postconditions: ["Message stored"]

    - step: 2
      action: "Apply routing strategy"
      preconditions: ["Message exists", "Routes defined"]
      postconditions: ["Route determined or no match"]

    - step: 3
      action: "Invoke matched specialist agent"
      preconditions: ["Route matched"]
      postconditions: ["Specialist processes message"]

    - step: 4
      action: "If no match, use default agent"
      preconditions: ["No route matched", "Default agent exists"]
      postconditions: ["Default agent processes message"]

    - step: 5
      action: "Return specialist result"
      preconditions: ["Specialist completed"]
      postconditions: ["Result returned"]

  invariants:
    - "Only one agent processes each message"
    - "Routing decision made before agent invocation"
    - "Default agent used only when no explicit route matches"
    - "Routing is deterministic for same input"

error_handling:
  - condition: "No route matches and no default agent"
    error_type: "RoutingError"
    behavior: "Raise error with available routes"

  - condition: "Specialist agent fails"
    error_type: "AgentError"
    behavior: "Propagate error with routing context"

  - condition: "Routing strategy fails"
    error_type: "RoutingError"
    behavior: "Fall back to default agent if available"

test_cases:
  - name: "Keyword-based routing"
    description: "Route based on message keywords"
    input:
      message:
        role: "user"
        content: "What's the weather today?"
      config:
        routes:
          "weather": "WeatherAgent"
          "stocks": "StockAgent"
        routing_strategy: "keyword"
    expected_behavior:
      routed_to: "WeatherAgent"
    assertions:
      - "Keyword 'weather' matched"
      - "WeatherAgent processed message"

  - name: "Default fallback routing"
    description: "Use default when no route matches"
    input:
      message:
        role: "user"
        content: "Tell me a joke"
      config:
        routes: {"weather": "WeatherAgent"}
        default_agent: "GeneralAgent"
    expected_behavior:
      routed_to: "GeneralAgent"
    assertions:
      - "No keyword matched"
      - "Default agent used"

  - name: "Metadata-based routing"
    description: "Route based on message metadata"
    input:
      message:
        role: "user"
        content: "Process this"
        metadata: {"category": "technical"}
      config:
        routes: {"technical": "TechnicalAgent", "sales": "SalesAgent"}
        routing_strategy: "metadata"
    expected_behavior:
      routed_to: "TechnicalAgent"
    assertions:
      - "Metadata category matched"
      - "Correct specialist invoked"

performance:
  latency: "routing_time + specialist_time"
  throughput: "High - single agent invocation"
  memory: "O(N) where N = routes"
  cost: "Routing cost (minimal) + specialist cost"

composition:
  can_be_agent: true
  can_contain:
    - "Specialists: any Agent implementations"

cross_language_equivalence:
  verified: false
  test_required: true
  notes: "Routing logic must be identical. Keyword matching should be case-insensitive and consistent."
