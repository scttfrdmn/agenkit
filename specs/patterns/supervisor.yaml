pattern:
  name: "Supervisor"
  category: "advanced"
  description: "Oversee and coordinate execution of subordinate agents with approval and error handling"
  version: "1.0.0"
  aliases: ["oversight-agent", "coordinator"]

# Constructor parameters below match the real Python SupervisorConfig
# fields (agenkit/patterns/supervisor.py), corrected by #924's audit. The
# spec previously called the coordinator "supervisor" (real field:
# "planner" -- an object implementing plan()/synthesize(), not a plain
# Agent) and "workers" (real field: "specialists", a name-keyed map, not
# a flat list). "require_approval" does not exist anywhere in the real
# implementation; human-approval gating for a supervised workflow is a
# separate, composable concern (see human_in_loop.yaml), not a
# SupervisorAgent constructor option.
interface:
  constructor:
    parameters:
      - name: "planner"
        type: "Agent"
        required: true
        description: "Agent responsible for task decomposition and result synthesis (implements plan() and synthesize())"

      - name: "specialists"
        type: "Map<string, Agent>"
        required: true
        description: "Specialist agents keyed by their domain/type"

behavior:
  execution:
    - step: 1
      action: "Supervisor analyzes task"
    - step: 2
      action: "Delegate subtasks to workers"
    - step: 3
      action: "Monitor worker execution"
    - step: 4
      action: "Review worker outputs"
    - step: 5
      action: "Approve or request revisions"

  invariants:
    - "Supervisor makes final decisions"
    - "Workers report to supervisor"
    - "Supervisor can override or revise"

test_cases:
  - name: "Supervised execution"
    description: "Supervisor coordinates workers"
    assertions:
      - "Workers delegated tasks"
      - "Supervisor reviews results"

performance:
  latency: "supervisor_time + worker_times + review_time"

cross_language_equivalence:
  verified: false
  test_required: true
