pattern:
  name: "Task"
  category: "specialized"
  description: "Single-purpose agent optimized for specific, well-defined tasks"
  version: "1.0.0"
  aliases: ["single-task", "focused-agent"]

# Constructor parameters below match the real Python Task.__init__
# (agenkit/patterns/task.py), corrected by #924's audit. The spec
# previously described a single-purpose LLM-configured agent
# ("llm"/"system_prompt"/"name"), but Python's Task class is a lifecycle
# wrapper around an *existing* Agent (any agent, not necessarily an
# LLM), not a system-prompt-driven agent constructor -- it takes "agent",
# and optional "timeout"/"retries" for one-shot execution, and exposes
# execute()/cleanup() rather than a bare process(). Description/category
# in the `pattern:` block above still apply; only the interface was wrong.
interface:
  constructor:
    parameters:
      - name: "agent"
        type: "Agent"
        required: true
        description: "The agent to execute"

      - name: "timeout"
        type: "number"
        required: false
        default: null
        description: "Optional timeout in seconds for task execution"

      - name: "retries"
        type: "number"
        required: false
        default: 0
        description: "Number of retry attempts on failure"

  methods:
    execute:
      input: "Message[]"
      output: "Message"
      async: true
      description: "Execute the task once; raises if called more than once per Task instance"

    cleanup:
      output: "void"
      async: true
      description: "Release resources after execution"

behavior:
  state:
    - name: "completed"
      type: "boolean"
      description: "Whether execute() has already been called once"

  execution:
    - step: 1
      action: "Receive input messages via execute()"
      preconditions: ["Task not yet completed"]
      postconditions: ["Input stored"]

    - step: 2
      action: "Delegate to the wrapped agent, applying timeout if configured"
      preconditions: ["Input exists"]
      postconditions: ["Agent invoked with configured timeout/retries"]

    - step: 3
      action: "Mark task as completed"
      preconditions: ["Agent call finished (success or error)"]
      postconditions: ["completed = true", "Result stored"]

    - step: 4
      action: "Return result"
      preconditions: ["Result exists"]
      postconditions: ["Result returned"]

  invariants:
    - "execute() can be called at most once per Task instance"
    - "No memory between separate Task instances"
    - "Wrapped agent is never reused after cleanup()"

error_handling:
  - condition: "Wrapped agent fails"
    error_type: "AgentError"
    behavior: "Propagate error immediately"

  - condition: "execute() called more than once"
    error_type: "RuntimeError"
    behavior: "Raise error; create a new Task for another execution"

  - condition: "Execution exceeds configured timeout"
    error_type: "TimeoutError"
    behavior: "Raise timeout error"

test_cases:
  - name: "Summarization task"
    description: "Wrapped agent summarizes text"
    input:
      message:
        role: "user"
        content: "Long article text..."
      config:
        agent: "SummarizerAgent"
    expected_output:
      message:
        role: "assistant"
        content: "Brief summary..."
    assertions:
      - "Output is shorter than input"
      - "Output captures main points"

  - name: "One-shot execution"
    description: "Second execute() call on the same Task instance raises"
    test_sequence:
      - action: "task.execute(messages)"
        output: "Hello!"
      - action: "task.execute(messages)"
        expected_error: "RuntimeError"
    assertions:
      - "Second execute() call raises RuntimeError"
      - "Task instance cannot be reused"

  - name: "Timeout handling"
    description: "Execution exceeding the configured timeout raises"
    input:
      config:
        agent: "SlowAgent"
        timeout: 0.01
    expected_error:
      type: "TimeoutError"
    assertions:
      - "TimeoutError raised when agent exceeds timeout"

performance:
  latency: "Single wrapped-agent call (plus retries, if configured)"
  throughput: "High - one-shot, parallelizable across separate Task instances"
  memory: "O(1) - no state beyond the single result"
  cost: "Single wrapped-agent cost per execute() call"

composition:
  can_be_agent: false
  can_contain:
    - "Agent: any Agent implementation (wrapped for one-shot execution)"

examples:
  - language: "Python"
    code: |
      from agenkit.patterns import Task

      async with Task(summarizer_agent, timeout=30.0, retries=2) as task:
          result = await task.execute([document_message])

cross_language_equivalence:
  verified: false
  test_required: true
  notes: "Simplest pattern - should have exact equivalence"
