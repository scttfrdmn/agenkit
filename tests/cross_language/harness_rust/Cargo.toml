[package]
name = "harness_rust"
version = "0.46.0"
edition = "2021"

[[bin]]
name = "harness_rust"
path = "src/main.rs"

[dependencies]
# Core dependencies
agenkit = { path = "../../../agenkit-rust", features = ["native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Optional for better regex support in some patterns
regex = "1.10"
